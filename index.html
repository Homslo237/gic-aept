// ================= IMPORT DE DONNÉES (copier-coller depuis Excel/WhatsApp) =================
// Ordre des colonnes attendu (identique à l'import des 94 abonnés de Juin 2026) :
// Référence | Nom | N° compteur | Localisation | N° facture | Ancien index | Nouveau index
// | Prix unitaire | Frais entretien | Impayés antérieurs | Montant conso | Montant à payer
function parseImportText(text) {
  const lines = text.split(/\r?\n/).map((l) => l.trim()).filter((l) => l.length > 0);
  const valid = [];
  const invalid = [];
  const toNum = (v) => {
    const n = Number(String(v == null ? "" : v).replace(/[\s\u00A0]/g, "").replace(",", "."));
    return isNaN(n) ? null : n;
  };
  lines.forEach((line, idx) => {
    let cols = line.includes("\t") ? line.split("\t") : line.includes(";") ? line.split(";") : line.split(",");
    cols = cols.map((c) => c.trim());
    // Ignore une éventuelle ligne d'en-tête (ex: "Référence, Nom, ...")
    if (idx === 0 && cols[0] && /r[ée]f|nom/i.test(cols[0]) && toNum(cols[0]) === null) return;
    if (cols.length < 7) {
      invalid.push({ ligne: idx + 1, raw: line, motif: `${cols.length} colonne(s) trouvée(s), au moins 7 attendues` });
      return;
    }
    const [refAbonne, nom, numCompteur, localisation, numFacture, ancienStr, nouveauStr, prixStr, fraisStr, impayesStr, montantConsoStr, montantAPayerStr] = cols;
    const ancien = toNum(ancienStr);
    const nouveau = toNum(nouveauStr);
    if (!refAbonne || !nom || ancien === null || nouveau === null) {
      invalid.push({ ligne: idx + 1, raw: line, motif: "Référence, nom, ancien ou nouveau index illisible" });
      return;
    }
    const prix = toNum(prixStr) ?? 0;
    const frais = toNum(fraisStr) ?? 0;
    const impayes = toNum(impayesStr) ?? 0;
    const montantConso = toNum(montantConsoStr) ?? (nouveau - ancien) * prix;
    const montantAPayer = toNum(montantAPayerStr) ?? montantConso + frais + impayes;
    valid.push({ refAbonne, nom, numCompteur: numCompteur || "", localisation: localisation || "", numFacture: numFacture || "", ancien, nouveau, prix, frais, impayes, montantConso, montantAPayer });
  });
  return { valid, invalid };
}

function ImportDonnees({ periode, abonnes, onImportDonnees, onClose }) {
  const [importPeriode, setImportPeriode] = useState(periode);
  const [result, setResult] = useState(null);
  const [nomFichier, setNomFichier] = useState("");
  const [chargement, setChargement] = useState(false);
  const [erreurFichier, setErreurFichier] = useState("");
  const fileInputRef = React.useRef(null);

  const lireFichierExcel = (file) => {
    setChargement(true);
    setErreurFichier("");
    setResult(null);
    setNomFichier(file.name);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        const nonEmpty = rows.filter((r) => r.some((cell) => String(cell).trim() !== ""));
        const text = nonEmpty.map((r) => r.join("\t")).join("\n");
        const r = parseImportText(text);
        const doublonsPotentiels = r.valid.filter((row) => {
          const refNorm = (row.refAbonne || "").trim().toUpperCase();
          const nomNorm = normalizeName(row.nom);
          return abonnes.some((a) => normalizeName(a.nom) === nomNorm && (a.refAbonne || "").trim().toUpperCase() !== refNorm);
        });
        setResult({ ...r, doublonsPotentiels });
      } catch (err) {
        setErreurFichier("Impossible de lire ce fichier. Vérifie qu'il est au format .xlsx ou .csv.");
      }
      setChargement(false);
    };
    reader.onerror = () => {
      setErreurFichier("Erreur lors de la lecture du fichier.");
      setChargement(false);
    };
    reader.readAsArrayBuffer(file);
  };

  const confirmer = () => {
    if (!result || result.valid.length === 0) return;
    onImportDonnees(importPeriode, result.valid);
    setResult(null);
    setNomFichier("");
    onClose();
  };

  return (
    <Card className="mb-3 !border-2 !border-dashed !border-[#0F5C6B]/40">
      <p className="text-[13px] font-700 text-[#0F5C6B] mb-1">Importer des relevés/factures</p>
      <p className="text-[11px] text-[#5B7070] mb-3">
        Sélectionne ton fichier Excel (.xlsx) ou CSV. Les colonnes doivent être dans cet ordre :
      </p>
      <div className="bg-[#F0F6F5] rounded-lg p-2 mb-3 overflow-x-auto">
        <code className="text-[9.5px] text-[#14232B] whitespace-nowrap">
          Référence | Nom | N° compteur | Localisation | N° facture | Ancien index | Nouveau index | Prix unitaire | Frais entretien | Impayés antérieurs | Montant conso | Montant à payer
        </code>
      </div>

      <Field label="Mois concerné par cet import">
        <input type="month" className={inputCls} value={importPeriode} onChange={(e) => setImportPeriode(e.target.value)} />
      </Field>

      <input
        type="file"
        accept=".xlsx,.xls,.csv"
        ref={fileInputRef}
        style={{ display: "none" }}
        onChange={(e) => { if (e.target.files && e.target.files[0]) lireFichierExcel(e.target.files[0]); }}
      />

      <button
        onClick={() => { if (fileInputRef.current) fileInputRef.current.click(); }}
        className="w-full flex items-center justify-center gap-2 bg-[#0F5C6B] text-white rounded-xl py-3.5 font-700 text-[14px] mb-3 active:opacity-80"
      >
        📂  Choisir un fichier Excel (.xlsx / .csv)
      </button>

      {nomFichier && !chargement && (
        <p className="text-[11px] text-[#5B7070] mb-2">
          📄 Fichier sélectionné : <strong>{nomFichier}</strong>
        </p>
      )}

      {chargement && (
        <p className="text-[12px] text-[#0F5C6B] mb-2">⏳ Lecture du fichier en cours…</p>
      )}

      {erreurFichier && (
        <div className="bg-[#FCE4E1] text-[#C0392B] text-[11px] rounded-xl px-3 py-2 mb-3">
          ⚠️ {erreurFichier}
        </div>
      )}

      {result && (
        <div className="mb-3">
          <div className="bg-[#DCF3E6] text-[#2E8B57] text-[12px] font-700 rounded-xl px-3 py-2 mb-1.5">
            ✓ {result.valid.length} ligne(s) prête(s) à importer pour {periodeLabel(importPeriode)}
          </div>
          {result.invalid.length > 0 && (
            <div className="bg-[#FCE4E1] text-[#C0392B] text-[11px] rounded-xl px-3 py-2 mb-1.5">
              ⚠️ {result.invalid.length} ligne(s) ignorée(s) — vérifie l'ordre des colonnes :
              <ul className="mt-1 pl-4 list-disc">
                {result.invalid.slice(0, 5).map((e, i) => (
                  <li key={i}>Ligne {e.ligne} : {e.motif}</li>
                ))}
              </ul>
            </div>
          )}
          {result.doublonsPotentiels && result.doublonsPotentiels.length > 0 && (
            <div className="bg-[#FCF3E3] text-[#8A6316] text-[11px] rounded-xl px-3 py-2 mb-1.5">
              ⚠️ {result.doublonsPotentiels.length} nom(s) correspondent déjà à un abonné existant sous une référence différente — vérifie avant de confirmer :
              <ul className="mt-1 pl-4 list-disc">
                {result.doublonsPotentiels.slice(0, 5).map((r, i) => (
                  <li key={i}>{r.nom} (réf. : {r.refAbonne})</li>
                ))}
              </ul>
            </div>
          )}
          {result.valid.length > 0 && (
            <p className="text-[11px] text-[#5B7070] mb-2">
              Aperçu : {result.valid.slice(0, 3).map((r) => r.nom).join(", ")}{result.valid.length > 3 ? "…" : ""}
            </p>
          )}
        </div>
      )}

      <div className="flex gap-2">
        {result && result.valid.length > 0 && (
          <div className="flex-1">
            <BigButton icon={Save} color="#2E8B57" onClick={confirmer}>
              Confirmer l'import de {result.valid.length} ligne(s)
            </BigButton>
          </div>
        )}
        <button onClick={onClose} className="shrink-0 text-[12px] font-700 text-[#8FA3A3] px-3">Annuler</button>
      </div>
      <p className="text-[10px] text-[#8FA3A3] mt-2">
        Si un abonné existant partage la même « Référence », ses infos ne sont pas dupliquées ; seul le relevé du mois choisi est ajouté ou remplacé.
      </p>
    </Card>
  );
}

// Calcule automatiquement la prochaine référence abonné (001, 002, 003...)
function prochainRef(abonnes) {
  let max = 0;
  abonnes.forEach((a) => {
    const num = parseInt(String(a.refAbonne || "").replace(/[^0-9]/g, ""), 10);
    if (!isNaN(num) && num > max) max = num;
  });
  return String(max + 1).padStart(3, "0");
}

function Abonnes({ abonnes, zones, periode, canManage, canAdd, onAdd, onUpdate, onDelete, onImportDonnees, onFicheSuivi, onFicheInsolvables, onFicheSuspendre }) {
  const [showForm, setShowForm] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [q, setQ] = useState("");
  const [editingId, setEditingId] = useState(null);
  const empty = { refAbonne: "", nom: "", zone: zones[0] || "Zone 1", localisation: "", numCompteur: "", telephone: "", statut: "Actif" };
  const [form, setForm] = useState(empty);
  const emptyAbonnement = { active: false, montant: "", avance: "" };
  const [abonnement, setAbonnement] = useState(emptyAbonnement);

  const filtered = abonnes.filter(
    (a) => a.nom.toLowerCase().includes(q.toLowerCase()) || a.zone.toLowerCase().includes(q.toLowerCase()) || a.refAbonne.toLowerCase().includes(q.toLowerCase())
  );

  const startEdit = (a) => {
    setEditingId(a.id);
    setForm({ refAbonne: a.refAbonne, nom: a.nom, zone: a.zone, localisation: a.localisation || "", numCompteur: a.numCompteur || "", telephone: a.telephone || "", statut: a.statut || "Actif" });
    setShowForm(true);
  };

  const cancelForm = () => {
    setShowForm(false);
    setEditingId(null);
    setForm({ ...empty, refAbonne: "" });
    setAbonnement(emptyAbonnement);
  };

  const submit = (e) => {
    e.preventDefault();
    if (!form.nom || !form.refAbonne) return;
    if (editingId) {
      onUpdate({ id: editingId, ...form });
    } else {
      const montant = Number(abonnement.montant) || 0;
      onAdd(
        { id: uid(), ...form },
        abonnement.active && montant > 0 ? { montant, avance: Number(abonnement.avance) || 0 } : null
      );
    }
    cancelForm();
  };

  return (
    <div>
      <SectionTitle light>Abonnés ({abonnes.length})</SectionTitle>

      <div className="flex gap-2 mb-3">
        <div className="relative flex-1">
          <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#8FA3A3]" />
          <input className={inputCls + " pl-9"} placeholder="Rechercher nom, zone, réf…" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        {canAdd && (
          <button onClick={() => (showForm ? cancelForm() : (setEditingId(null), setForm({ ...empty, refAbonne: prochainRef(abonnes) }), setShowForm(true)))} className="shrink-0 w-12 h-12 rounded-xl bg-[#0F5C6B] text-white flex items-center justify-center active:opacity-80">
            {showForm ? <X size={20} /> : <Plus size={20} />}
          </button>
        )}
      </div>

      {canManage && onImportDonnees && (
        <button
          onClick={() => setShowImport((s) => !s)}
          className="w-full mb-2 flex items-center justify-center gap-2 text-[13px] font-700 text-[#0F5C6B] bg-white/90 border border-[#0F5C6B]/30 rounded-xl py-2.5 active:bg-white shadow-md"
        >
          <Upload size={15} /> {showImport ? "Fermer l'import" : "Importer des données (factures d'un autre mois)"}
        </button>
      )}
      {canManage && showImport && onImportDonnees && (
        <ImportDonnees periode={periode} abonnes={abonnes} onImportDonnees={onImportDonnees} onClose={() => setShowImport(false)} />
      )}

      {onFicheSuivi && (
        <BigButton icon={Download} color="#E8A33D" onClick={onFicheSuivi}>
          Fiche de suivi des abonnés (PDF)
        </BigButton>
      )}
      <div className="h-2" />
      {onFicheInsolvables && (
        <BigButton icon={Download} color="#C0392B" onClick={onFicheInsolvables}>
          Fiche des clients insolvables (PDF)
        </BigButton>
      )}
      <div className="h-2" />
      {onFicheSuspendre && (
        <BigButton icon={Download} color="#14232B" onClick={onFicheSuspendre}>
          Fiche des clients à suspendre (PDF)
        </BigButton>
      )}
      <div className="h-3" />

      {canAdd && showForm && (
        <Card className="mb-4 !border-2 !border-[#0F5C6B]/30">
          {editingId && <p className="text-[12px] font-700 text-[#0F5C6B] mb-2">✏️ Modification de l'abonné</p>}
          <form onSubmit={submit}>
            <Field label="Réf. abonné *">
              <input className={inputCls} value={form.refAbonne} onChange={(e) => setForm({ ...form, refAbonne: e.target.value })} placeholder="Auto-généré (modifiable)" required />
            </Field>
            <Field label="Nom & prénom *">
              <input className={inputCls} value={form.nom} onChange={(e) => setForm({ ...form, nom: e.target.value })} required />
            </Field>
            <Field label="Zone">
              <select className={inputCls} value={form.zone} onChange={(e) => setForm({ ...form, zone: e.target.value })}>
                {zones.map((z) => <option key={z} value={z}>{z}</option>)}
              </select>
            </Field>
            <Field label="Localisation précise">
              <input className={inputCls} value={form.localisation} onChange={(e) => setForm({ ...form, localisation: e.target.value })} />
            </Field>
            <Field label="N° compteur">
              <input className={inputCls} value={form.numCompteur} onChange={(e) => setForm({ ...form, numCompteur: e.target.value })} />
            </Field>
            <Field label="Téléphone">
              <input className={inputCls} value={form.telephone} onChange={(e) => setForm({ ...form, telephone: e.target.value })} />
            </Field>
            <Field label="Statut">
              <select className={inputCls} value={form.statut} onChange={(e) => setForm({ ...form, statut: e.target.value })}>
                <option>Actif</option>
                <option>Suspendu</option>
              </select>
            </Field>

            {!editingId && (
              <div className="bg-[#F0F6F5] rounded-xl p-3 mb-3">
                <label className="flex items-center gap-2 mb-2">
                  <input type="checkbox" checked={abonnement.active} onChange={(e) => setAbonnement({ ...abonnement, active: e.target.checked })} />
                  <span className="text-[13px] font-700 text-[#0F5C6B]">Frais d'abonnement négocié (nouveau branchement)</span>
                </label>
                {abonnement.active && (
                  <>
                    <Field label="Montant total négocié (FCFA)">
                      <input type="number" className={inputCls} value={abonnement.montant} onChange={(e) => setAbonnement({ ...abonnement, montant: e.target.value })} placeholder="Ex: 100000" />
                    </Field>
                    <Field label="Avance versée maintenant (FCFA)">
                      <input type="number" className={inputCls} value={abonnement.avance} onChange={(e) => setAbonnement({ ...abonnement, avance: e.target.value })} placeholder="Ex: 40000" />
                    </Field>
                    {Number(abonnement.montant) > 0 && (
                      <p className="text-[11px] text-[#5B7070]">
                        Reste à payer après avance : <strong>{fmt(Math.max(0, Number(abonnement.montant) - (Number(abonnement.avance) || 0)))}</strong> — ce solde sera automatiquement ajouté aux impayés de l'abonné.
                      </p>
                    )}
                  </>
                )}
              </div>
            )}
            <div className="flex gap-2">
              <div className="flex-1">
                <BigButton type="submit" icon={Save}>{editingId ? "Enregistrer les modifications" : "Ajouter l'abonné"}</BigButton>
              </div>
              {editingId && (
                <button type="button" onClick={cancelForm} className="shrink-0 text-[12px] font-700 text-[#8FA3A3] px-3">Annuler</button>
              )}
            </div>
          </form>
        </Card>
      )}

      <div className="flex flex-col gap-2">
        {filtered.length === 0 && <p className="text-center text-white/80 text-sm py-8" style={{textShadow:"0 1px 4px rgba(0,0,0,0.3)"}}>Aucun abonné trouvé.</p>}
        {filtered.map((a, i) => (
          <Card key={a.id} className={`!p-3 ${i % 2 === 1 ? "!bg-[#F0F6F5]" : ""}`}>
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <p className="font-700 text-[15px] truncate">{a.nom}</p>
                <p className="text-[12px] text-[#5B7070]">{a.refAbonne} · {a.zone} · Cpt {a.numCompteur || "—"}</p>
                <p className="text-[12px] text-[#5B7070]">{a.telephone || "—"} · {a.localisation || "—"}</p>
              </div>
              <div className="flex flex-col items-end gap-1.5 shrink-0">
                <span className={`text-[10px] font-700 px-2 py-1 rounded-full ${a.statut === "Actif" ? "bg-[#DCF3E6] text-[#2E8B57]" : "bg-[#FCE4E1] text-[#C0392B]"}`}>
                  {a.statut}
                </span>
                {canManage && (
                  <div className="flex items-center gap-2">
                    <button onClick={() => startEdit(a)} className="text-[#0F5C6B]"><Pencil size={16} /></button>
                    <button onClick={() => onDelete(a.id)} className="text-[#C0392B]"><Trash2 size={16} /></button>
                  </div>
                )}
              </div>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

// ================= RELEVÉ & FACTURATION =================
function Releve({ periode, abonnes, zones, params, isDev, canAdd, canManage, paiements, relevesPeriode, resteAPayer, getAncienIndex, getImpayesAnterieurs, onSaveParams, onSaveReleve, onDeleteReleve, onGenerateZone, onError }) {
  const [showParams, setShowParams] = useState(false);
  const [p, setP] = useState(params);
  const [abonneId, setAbonneId] = useState(abonnes[0]?.id || "");
  const [zoneMass, setZoneMass] = useState(zones[0] || "Zone 1");
  const [searchAbonne, setSearchAbonne] = useState("");
  const [modeSaisieRapide, setModeSaisieRapide] = useState(false);

  // H - Badge mois cloture
  const abonnesActifs = abonnes.filter(a => a.statut !== "suspendu");
  const nbSaisis = abonnesActifs.filter(a => relevesPeriode.some(r => r.abonneId === a.id)).length;
  const moisCloture = abonnesActifs.length > 0 && nbSaisis === abonnesActifs.length;

  const abonnesFiltres = searchAbonne
    ? abonnes.filter(
        (a) =>
          a.nom.toLowerCase().includes(searchAbonne.toLowerCase()) ||
          a.refAbonne.toLowerCase().includes(searchAbonne.toLowerCase()) ||
          a.zone.toLowerCase().includes(searchAbonne.toLowerCase())
      )
    : abonnes;

  // Si la recherche exclut l'abonné actuellement sélectionné, on bascule sur le 1er résultat trouvé
  useEffect(() => {
    if (abonnesFiltres.length > 0 && !abonnesFiltres.some((a) => a.id === abonneId)) {
      setAbonneId(abonnesFiltres[0].id);
    }
  }, [searchAbonne]); // eslint-disable-line

  const existing = relevesPeriode.find((r) => r.abonneId === abonneId);
  const abonneSel = abonnes.find((a) => a.id === abonneId);
  const periodeActuelle = todayISO().slice(0, 7);
  const estPeriodePassee = periode < periodeActuelle;
  // La Secrétaire peut ajouter un relevé qui n'existe pas encore, mais pas modifier un relevé déjà enregistré,
  // ni rien saisir du tout dans un mois déjà passé (figé). L'Administrateur garde un droit de correction sur tous les mois.
  const lockedForEdit = !canManage && canAdd && (!!existing || estPeriodePassee);

  const [ancien, setAncien] = useState(0);
  const [nouveau, setNouveau] = useState(0);
  const [impayes, setImpayes] = useState(0);

  useEffect(() => {
    if (!abonneId) return;
    if (existing) {
      setAncien(existing.ancienIndex);
      setNouveau(existing.nouveauIndex);
      setImpayes(existing.impayesAnterieurs);
    } else {
      setAncien(getAncienIndex(abonneId, periode));
      setNouveau(getAncienIndex(abonneId, periode));
      setImpayes(getImpayesAnterieurs(abonneId, periode));
    }
  }, [abonneId, periode]); // eslint-disable-line

  const consommation = Math.max(0, Number(nouveau || 0) - Number(ancien || 0));
  const montantConso = consommation * Number(params.prixUnitaire || 0);
  const montantAPayer = montantConso + Number(params.fraisEntretien || 0) + Number(impayes || 0);

  const save = () => {
    if (!abonneId || lockedForEdit) return;
    onSaveReleve({
      id: releveId(abonneId, periode),
      abonneId,
      periode,
      ancienIndex: Number(ancien || 0),
      nouveauIndex: Number(nouveau || 0),
      consommation,
      prixUnitaire: Number(params.prixUnitaire || 0),
      fraisEntretien: Number(params.fraisEntretien || 0),
      impayesAnterieurs: Number(impayes || 0),
      montantConso,
      montantAPayer,
      numFacture: `${periode.replace("-", "")}-${abonneSel?.refAbonne || abonneId.slice(0, 4)}`,
    });
    // G - Mode saisie rapide : passer automatiquement au suivant sans releve
    if (modeSaisieRapide) {
      const currentIdx = abonnesFiltres.findIndex(a => a.id === abonneId);
      const nonSaisis = abonnesFiltres.filter(a => !relevesPeriode.some(r => r.abonneId === a.id) && a.id !== abonneId);
      if (nonSaisis.length > 0) {
        setTimeout(() => setAbonneId(nonSaisis[0].id), 300);
      }
    }
  };

  const paiementsLies = existing ? paiements.filter((pm) => pm.releveId === existing.id) : [];
  const [confirmDelete, setConfirmDelete] = useState(false);
  const deleteReleve = () => {
    if (paiementsLies.length > 0) {
      onError && onError(`Impossible de supprimer : ${paiementsLies.length} paiement(s) sont liés à ce relevé. Supprimez-les d'abord dans l'onglet Historique.`);
      setConfirmDelete(false);
      return;
    }
    onDeleteReleve(existing.id);
    setConfirmDelete(false);
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <SectionTitle light>Relevé & facturation</SectionTitle>
        {isDev && (
          <button onClick={() => setShowParams((s) => !s)} className="text-[12px] font-700 text-white underline" style={{ textShadow: "0 1px 4px rgba(0,0,0,0.35)" }}>Tarifs</button>
        )}
      </div>

      {/* H - Badge mois cloture */}
      {moisCloture ? (
        <div className="mb-3 bg-[#DCF3E6] border border-[#2E8B57] rounded-xl px-3 py-2.5 flex items-center gap-2">
          <span className="text-[18px]">✅</span>
          <div>
            <p className="text-[12px] font-800 text-[#2E8B57]">Mois clôturé !</p>
            <p className="text-[11px] text-[#2E8B57]/80">Tous les {abonnesActifs.length} abonnés actifs ont été relevés</p>
          </div>
        </div>
      ) : (
        <div className="mb-3 bg-white/80 border border-[#E2E8E7] rounded-xl px-3 py-2 flex items-center justify-between gap-2">
          <div className="flex items-center gap-2">
            <span className="text-[14px]">📋</span>
            <p className="text-[12px] font-600 text-[#14232B]">{nbSaisis} / {abonnesActifs.length} abonnés relevés</p>
          </div>
          <div className="flex-1 mx-2 h-2 bg-[#E2E8E7] rounded-full overflow-hidden">
            <div className="h-full bg-[#0F5C6B] rounded-full transition-all" style={{width: abonnesActifs.length > 0 ? (nbSaisis/abonnesActifs.length*100)+'%' : '0%'}} />
          </div>
          {/* G - Bouton mode saisie rapide */}
          {canAdd && (
            <button onClick={() => setModeSaisieRapide(m => !m)}
              className="text-[10px] font-700 px-2 py-1 rounded-lg"
              style={{background: modeSaisieRapide ? "#0F5C6B" : "#E2E8E7", color: modeSaisieRapide ? "white" : "#5B7070"}}>
              {modeSaisieRapide ? "⚡ Rapide ON" : "⚡ Rapide"}
            </button>
          )}
        </div>
      )}

      {isDev && showParams && (
        <Card className="mb-3">
          <Field label="Prix unitaire (FCFA / m³)">
            <input type="number" className={inputCls} value={p.prixUnitaire} onChange={(e) => setP({ ...p, prixUnitaire: e.target.value })} />
          </Field>
          <Field label="Frais d'entretien fixe (FCFA)">
            <input type="number" className={inputCls} value={p.fraisEntretien} onChange={(e) => setP({ ...p, fraisEntretien: e.target.value })} />
          </Field>
          <BigButton icon={Save} onClick={() => { onSaveParams({ prixUnitaire: Number(p.prixUnitaire), fraisEntretien: Number(p.fraisEntretien) }); setShowParams(false); }}>
            Enregistrer les tarifs
          </BigButton>
        </Card>
      )}

      {canAdd ? (
        <Card className="mb-4">
          <Field label="Rechercher un client">
            <div className="relative">
              <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#8FA3A3]" />
              <input
                className={inputCls + " pl-9"}
                placeholder="Nom, référence ou zone…"
                value={searchAbonne}
                onChange={(e) => setSearchAbonne(e.target.value)}
              />
            </div>
          </Field>
          <Field label="Abonné">
            <select className={inputCls} value={abonneId} onChange={(e) => { setAbonneId(e.target.value); setConfirmDelete(false); }}>
              {abonnesFiltres.length === 0 && <option value="">Aucun abonné ne correspond</option>}
              {abonnesFiltres.map((a) => <option key={a.id} value={a.id}>{a.nom} ({a.refAbonne} — {a.zone})</option>)}
            </select>
          </Field>

          {lockedForEdit && (
            <div className="bg-[#FCF3E3] text-[#8A6316] text-[12px] rounded-xl px-3 py-2 mb-3">
              🔒 {estPeriodePassee
                ? `${periodeLabel(periode)} est un mois déjà passé — figé. Seul l'administrateur peut encore le modifier.`
                : `Un relevé existe déjà pour ${abonneSel?.nom} ce mois-ci. Seul l'administrateur peut le modifier ou le supprimer.`}
            </div>
          )}

          <div className="grid grid-cols-2 gap-3">
            <Field label="Ancien index (automatique — non modifiable)">
              <input type="number" disabled className={inputCls + " !bg-[#EDF2F1] !text-[#5B7070]"} value={ancien} readOnly />
            </Field>
            <Field label="Nouveau index">
              <input type="number" disabled={lockedForEdit} className={inputCls + (lockedForEdit ? " !bg-[#EDF2F1] !text-[#5B7070]" : "")} value={nouveau} onChange={(e) => setNouveau(e.target.value)} />
            </Field>
          </div>
          <Field label="Impayés / avances antérieurs (FCFA)">
            <input type="number" disabled={lockedForEdit} className={inputCls + (lockedForEdit ? " !bg-[#EDF2F1] !text-[#5B7070]" : "")} value={impayes} onChange={(e) => setImpayes(e.target.value)} />
          </Field>

          <div className="bg-[#F0F6F5] rounded-xl p-3 mb-3 text-[13px] space-y-1">
            <Row label="Consommation" value={`${consommation} m³`} />
            <Row label="Montant consommation" value={fmt(montantConso)} />
            <Row label="Frais entretien" value={fmt(params.fraisEntretien)} />
            <Row label="Impayés reportés" value={fmt(impayes)} />
            <Row label="Net à payer" value={fmt(montantAPayer)} bold />
          </div>

          {!lockedForEdit && (
            <BigButton icon={Save} onClick={save}>{existing ? "Mettre à jour le relevé" : "Enregistrer le relevé"}</BigButton>
          )}

          {existing && canManage && (
            <div className="mt-2">
              {confirmDelete ? (
                <div className="flex gap-2">
                  <button onClick={deleteReleve} className="flex-1 bg-[#C0392B] text-white rounded-xl py-2.5 text-[13px] font-700">Confirmer la suppression</button>
                  <button onClick={() => setConfirmDelete(false)} className="text-[12px] font-700 text-[#8FA3A3] px-3">Annuler</button>
                </div>
              ) : (
                <button onClick={() => setConfirmDelete(true)} className="w-full flex items-center justify-center gap-1.5 text-[12px] font-700 text-[#C0392B] py-2">
                  <Trash2 size={14} /> Supprimer ce relevé
                </button>
              )}
            </div>
          )}
        </Card>
      ) : (
        <Card className="mb-4">
          <p className="text-[13px] text-[#8FA3A3] text-center py-2">Consultation seule — seuls l'administrateur et la secrétaire peuvent saisir un relevé.</p>
        </Card>
      )}

      <Card className="mb-4">
        <SectionTitle>Génération de masse</SectionTitle>
        <Field label="Zone">
          <select className={inputCls} value={zoneMass} onChange={(e) => setZoneMass(e.target.value)}>
            {zones.map((z) => <option key={z} value={z}>{z}</option>)}
          </select>
        </Field>
        <BigButton icon={Printer} color="#E8A33D" onClick={() => onGenerateZone(zoneMass)}>
          Générer les factures de la zone
        </BigButton>
      </Card>

      <SectionTitle light>Relevés — {periodeLabel(periode)} ({relevesPeriode.length})</SectionTitle>
      <div className="flex flex-col gap-2">
        {relevesPeriode.map((r, i) => {
          const a = abonnes.find((x) => x.id === r.abonneId);
          const reste = resteAPayer(r);
          return (
            <Card key={r.id} className={`!p-3 ${i % 2 === 1 ? "!bg-[#F0F6F5]" : ""}`}>
              <div className="flex justify-between items-start">
                <div>
                  <p className="font-700 text-[14px]">{a?.nom || "—"}</p>
                  <p className="text-[12px] text-[#5B7070]">{a?.zone} · {r.consommation} m³ · {fmt(r.montantAPayer)}</p>
                </div>
                <span className={`text-[11px] font-700 px-2 py-1 rounded-full ${reste <= 0 ? "bg-[#DCF3E6] text-[#2E8B57]" : "bg-[#FCE4E1] text-[#C0392B]"}`}>
                  {reste <= 0 ? "Soldé" : `Reste ${fmt(reste)}`}
                </span>
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}
function Row({ label, value, bold }) {
  return (
    <div className="flex justify-between">
      <span className="text-[#5B7070]">{label}</span>
      <span className={bold ? "font-700 text-[#0F5C6B]" : "font-600"}>{value}</span>
    </div>
  );
}

// ================= HISTORIQUE =================
function Historique({ abonnes, releves, paiements, resteAPayer, canAdd, canManage, onAddPaiement, onUpdatePaiement, onDeletePaiement, recettesDiverses, onAddRecette, onUpdateRecette, onDeleteRecette, onError }) {
  const releveOptions = releves
    .map((r) => ({ r, a: abonnes.find((a) => a.id === r.abonneId), reste: resteAPayer(r) }))
    .sort((x, y) => (x.r.periode < y.r.periode ? 1 : -1));

  const empty = { releveId: releveOptions[0]?.r.id || "", date: todayISO(), montant: "", mode: "Espèces", caissier: "" };
  const [form, setForm] = useState(empty);
  const [q, setQ] = useState("");
  const [searchClient, setSearchClient] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  const releveOptionsFiltres = searchClient
    ? releveOptions.filter(({ a, r }) => (a?.nom || "").toLowerCase().includes(searchClient.toLowerCase()) || (r.numFacture || "").toLowerCase().includes(searchClient.toLowerCase()))
    : releveOptions;

  useEffect(() => {
    if (releveOptionsFiltres.length > 0 && !releveOptionsFiltres.some((o) => o.r.id === form.releveId)) {
      setForm((f) => ({ ...f, releveId: releveOptionsFiltres[0].r.id }));
    }
  }, [searchClient]); // eslint-disable-line

  const submit = (e) => {
    e.preventDefault();
    if (releveOptions.length === 0) {
      onError && onError("Aucun relevé disponible : enregistrez d'abord un relevé dans l'onglet Relevé.");
      return;
    }
    if (!form.releveId) {
      onError && onError("Sélectionnez un client / une facture avant d'enregistrer.");
      return;
    }
    if (!form.montant || Number(form.montant) <= 0) {
      onError && onError("Saisissez un montant versé supérieur à 0.");
      return;
    }
    const sel = releveOptions.find((o) => o.r.id === form.releveId);
    onAddPaiement({
      id: uid(),
      releveId: form.releveId,
      numFacture: sel?.r.numFacture,
      abonneNom: sel?.a?.nom,
      date: form.date,
      montant: Number(form.montant),
      mode: form.mode,
      caissier: form.caissier,
    });
    setForm({ ...empty, montant: "", caissier: form.caissier });
  };

  const startEdit = (p) => {
    setEditingId(p.id);
    setEditForm({ date: p.date, montant: p.montant, mode: p.mode, caissier: p.caissier || "" });
    setConfirmDeleteId(null);
  };
  const saveEdit = (p) => {
    if (!editForm.montant || Number(editForm.montant) <= 0) {
      onError && onError("Le montant doit être supérieur à 0.");
      return;
    }
    onUpdatePaiement({ ...p, date: editForm.date, montant: Number(editForm.montant), mode: editForm.mode, caissier: editForm.caissier });
    setEditingId(null);
    setEditForm(null);
  };

  const filteredPaiements = q
    ? paiements.filter((p) => (p.abonneNom || "").toLowerCase().includes(q.toLowerCase()) || (p.numFacture || "").toLowerCase().includes(q.toLowerCase()))
    : paiements;

  // ---- Recettes diverses (argent encaissé hors facture d'eau) ----
  const emptyRecette = { libelle: "", montant: "", acteur: "", date: todayISO() };
  const [recetteForm, setRecetteForm] = useState(emptyRecette);
  const [editingRecetteId, setEditingRecetteId] = useState(null);
  const [editRecetteForm, setEditRecetteForm] = useState(null);
  const [confirmDeleteRecetteId, setConfirmDeleteRecetteId] = useState(null);

  const submitRecette = (e) => {
    e.preventDefault();
    if (!recetteForm.libelle.trim()) { onError && onError("Indiquez le libellé de la recette."); return; }
    if (!recetteForm.montant || Number(recetteForm.montant) <= 0) { onError && onError("Saisissez un montant supérieur à 0."); return; }
    onAddRecette({
      id: uid(),
      date: recetteForm.date,
      libelle: recetteForm.libelle.trim(),
      montant: Number(recetteForm.montant),
      acteur: recetteForm.acteur.trim(),
    });
    setRecetteForm({ ...emptyRecette, acteur: recetteForm.acteur });
  };
  const startEditRecette = (r) => {
    setEditingRecetteId(r.id);
    setEditRecetteForm({ date: r.date, libelle: r.libelle, montant: r.montant, acteur: r.acteur || "" });
    setConfirmDeleteRecetteId(null);
  };
  const saveEditRecette = (r) => {
    if (!editRecetteForm.libelle.trim()) { onError && onError("Le libellé ne peut pas être vide."); return; }
    if (!editRecetteForm.montant || Number(editRecetteForm.montant) <= 0) { onError && onError("Le montant doit être supérieur à 0."); return; }
    onUpdateRecette({ ...r, date: editRecetteForm.date, libelle: editRecetteForm.libelle.trim(), montant: Number(editRecetteForm.montant), acteur: editRecetteForm.acteur.trim() });
    setEditingRecetteId(null);
    setEditRecetteForm(null);
  };
  const recettesRecentes = [...(recettesDiverses || [])].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 50);

  return (
    <div>
      <SectionTitle light>Enregistrer un paiement</SectionTitle>
      {canAdd ? (
        <Card className="mb-4">
          <form onSubmit={submit}>
            <Field label="Rechercher un client">
              <div className="relative">
                <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#8FA3A3]" />
                <input
                  className={inputCls + " pl-9"}
                  placeholder="Nom ou n° facture…"
                  value={searchClient}
                  onChange={(e) => setSearchClient(e.target.value)}
                />
              </div>
            </Field>
            <Field label="Client / N° facture">
              <select className={inputCls} value={form.releveId} onChange={(e) => setForm({ ...form, releveId: e.target.value })}>
                {releveOptionsFiltres.length === 0 && <option value="">Aucun résultat</option>}
                {releveOptionsFiltres.map(({ r, a, reste }) => (
                  <option key={r.id} value={r.id}>{a?.nom} — {r.numFacture} — reste {fmt(reste)}</option>
                ))}
              </select>
            </Field>
            <Field label="Date">
              <input type="date" className={inputCls} value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
            </Field>
            <Field label="Montant versé (FCFA)">
              <input type="number" className={inputCls} value={form.montant} onChange={(e) => setForm({ ...form, montant: e.target.value })} required />
            </Field>
            <Field label="Mode de paiement">
              <select className={inputCls} value={form.mode} onChange={(e) => setForm({ ...form, mode: e.target.value })}>
                <option>Espèces</option>
                <option>MoMo</option>
                <option>Orange Money</option>
              </select>
            </Field>
            <Field label="Nom du caissier">
              <input className={inputCls} value={form.caissier} onChange={(e) => setForm({ ...form, caissier: e.target.value })} />
            </Field>
            <BigButton type="submit" icon={Save} color="#2E8B57">Enregistrer le paiement</BigButton>
          </form>
        </Card>
      ) : (
        <Card className="mb-4">
          <p className="text-[13px] text-[#8FA3A3] text-center py-2">Consultation seule — seuls l'administrateur et la secrétaire peuvent enregistrer un paiement.</p>
        </Card>
      )}

      <SectionTitle light>Derniers paiements ({paiements.length})</SectionTitle>
      <div className="relative mb-2">
        <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#8FA3A3]" />
        <input className={inputCls + " pl-9"} placeholder="Rechercher un client…" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      <div className="flex flex-col gap-2">
        {filteredPaiements.length === 0 && <p className="text-center text-white/80 text-sm py-8" style={{textShadow:"0 1px 4px rgba(0,0,0,0.3)"}}>Aucun paiement trouvé.</p>}
        {filteredPaiements.slice(0, 80).map((p, i) => (
          <Card key={p.id} className={`!p-3 ${i % 2 === 1 ? "!bg-[#F0F6F5]" : ""}`}>
            {editingId === p.id ? (
              <div>
                <p className="text-[12px] font-700 text-[#0F5C6B] mb-2">✏️ Modification — {p.abonneNom}</p>
                <div className="grid grid-cols-2 gap-2 mb-2">
                  <input type="date" className={inputCls} value={editForm.date} onChange={(e) => setEditForm({ ...editForm, date: e.target.value })} />
                  <input type="number" className={inputCls} value={editForm.montant} onChange={(e) => setEditForm({ ...editForm, montant: e.target.value })} />
                </div>
                <div className="grid grid-cols-2 gap-2 mb-2">
                  <select className={inputCls} value={editForm.mode} onChange={(e) => setEditForm({ ...editForm, mode: e.target.value })}>
                    <option>Espèces</option>
                    <option>MoMo</option>
                    <option>Orange Money</option>
                  </select>
                  <input className={inputCls} placeholder="Caissier" value={editForm.caissier} onChange={(e) => setEditForm({ ...editForm, caissier: e.target.value })} />
                </div>
                <div className="flex gap-2">
                  <button onClick={() => saveEdit(p)} className="flex-1 bg-[#2E8B57] text-white rounded-xl py-2 text-[13px] font-700">Enregistrer</button>
                  <button onClick={() => { setEditingId(null); setEditForm(null); }} className="text-[12px] font-700 text-[#8FA3A3] px-3">Annuler</button>
                </div>
              </div>
            ) : (
              <div className="flex justify-between items-start">
                <div className="min-w-0">
                  <p className="font-700 text-[14px] truncate">{p.abonneNom || "—"}</p>
                  <p className="text-[12px] text-[#5B7070]">{p.numFacture} · {p.date} · {p.mode} · {p.caissier || "—"}</p>
                </div>
                <div className="flex flex-col items-end gap-1 shrink-0">
                  <p className="font-700 text-[#2E8B57] text-[14px]">{fmt(p.montant)}</p>
                  {canManage && (
                    confirmDeleteId === p.id ? (
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => { onDeletePaiement(p.id); setConfirmDeleteId(null); }} className="text-[10px] font-700 text-white bg-[#C0392B] rounded-full px-2 py-1">Confirmer</button>
                        <button onClick={() => setConfirmDeleteId(null)} className="text-[10px] font-700 text-[#8FA3A3]">Annuler</button>
                      </div>
                    ) : (
                      <div className="flex items-center gap-2">
                        <button onClick={() => startEdit(p)} className="text-[#0F5C6B]"><Pencil size={15} /></button>
                        <button onClick={() => setConfirmDeleteId(p.id)} className="text-[#C0392B]"><Trash2 size={15} /></button>
                      </div>
                    )
                  )}
                </div>
              </div>
            )}
          </Card>
        ))}
      </div>

      <SectionTitle light>Recettes diverses (hors facture d'eau)</SectionTitle>
      <p className="text-[11px] text-white/85 mb-2" style={{ textShadow: "0 1px 4px rgba(0,0,0,0.3)" }}>
        Pour tout argent encaissé qui n'est pas un paiement de facture d'eau : pénalité, vente de matériel usagé, don, etc. Ce montant s'ajoute au Total Encaissé du Bilan.
      </p>
      {canAdd ? (
        <Card className="mb-4">
          <form onSubmit={submitRecette}>
            <Field label="Libellé (ex: Vente motopompe usagée)">
              <input className={inputCls} value={recetteForm.libelle} onChange={(e) => setRecetteForm({ ...recetteForm, libelle: e.target.value })} placeholder="Ex: Pénalité retard" />
            </Field>
            <Field label="Montant (FCFA)">
              <input type="number" className={inputCls} value={recetteForm.montant} onChange={(e) => setRecetteForm({ ...recetteForm, montant: e.target.value })} placeholder="0" />
            </Field>
            <Field label="Date">
              <input type="date" className={inputCls} value={recetteForm.date} onChange={(e) => setRecetteForm({ ...recetteForm, date: e.target.value })} />
            </Field>
            <Field label="Nom de l'acteur (qui a encaissé)">
              <input className={inputCls} value={recetteForm.acteur} onChange={(e) => setRecetteForm({ ...recetteForm, acteur: e.target.value })} placeholder="Ex: Jacques" />
            </Field>
            <BigButton type="submit" icon={Save} color="#2E8B57">Enregistrer la recette</BigButton>
          </form>
        </Card>
      ) : (
        <Card className="mb-4">
          <p className="text-[13px] text-[#8FA3A3] text-center py-2">Consultation seule.</p>
        </Card>
      )}
      <div className="flex flex-col gap-2">
        {recettesRecentes.length === 0 && (
          <p className="text-center text-white/80 text-sm py-6" style={{ textShadow: "0 1px 4px rgba(0,0,0,0.3)" }}>Aucune recette diverse enregistrée.</p>
        )}
        {recettesRecentes.map((r, i) => (
          <Card key={r.id} className={`!p-3 ${i % 2 === 1 ? "!bg-[#F0F6F5]" : ""}`}>
            {editingRecetteId === r.id ? (
              <div>
                <p className="text-[12px] font-700 text-[#0F5C6B] mb-2">✏️ Modification</p>
                <Field label="Libellé">
                  <input className={inputCls} value={editRecetteForm.libelle} onChange={(e) => setEditRecetteForm({ ...editRecetteForm, libelle: e.target.value })} />
                </Field>
                <div className="grid grid-cols-2 gap-2 mb-2">
                  <input type="date" className={inputCls} value={editRecetteForm.date} onChange={(e) => setEditRecetteForm({ ...editRecetteForm, date: e.target.value })} />
                  <input type="number" className={inputCls} value={editRecetteForm.montant} onChange={(e) => setEditRecetteForm({ ...editRecetteForm, montant: e.target.value })} placeholder="Montant" />
                </div>
                <input className={inputCls + " mb-2"} value={editRecetteForm.acteur} onChange={(e) => setEditRecetteForm({ ...editRecetteForm, acteur: e.target.value })} placeholder="Acteur" />
                <div className="flex gap-2">
                  <button onClick={() => saveEditRecette(r)} className="flex-1 bg-[#2E8B57] text-white rounded-xl py-2 text-[13px] font-700">Enregistrer</button>
                  <button onClick={() => { setEditingRecetteId(null); setEditRecetteForm(null); }} className="text-[12px] font-700 text-[#8FA3A3] px-3">Annuler</button>
                </div>
              </div>
            ) : (
              <div className="flex justify-between items-start">
                <div className="min-w-0">
                  <p className="font-700 text-[14px] truncate">{r.libelle}</p>
                  <p className="text-[12px] text-[#5B7070]">{r.date} · {r.acteur || "—"}</p>
                </div>
                <div className="flex flex-col items-end gap-1 shrink-0">
                  <p className="font-700 text-[#2E8B57] text-[14px]">{fmt(r.montant)}</p>
                  {canManage && (
                    confirmDeleteRecetteId === r.id ? (
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => { onDeleteRecette(r.id); setConfirmDeleteRecetteId(null); }} className="text-[10px] font-700 text-white bg-[#C0392B] rounded-full px-2 py-1">Confirmer</button>
                        <button onClick={() => setConfirmDeleteRecetteId(null)} className="text-[10px] font-700 text-[#8FA3A3]">Annuler</button>
                      </div>
                    ) : (
                      <div className="flex items-center gap-2">
                        <button onClick={() => startEditRecette(r)} className="text-[#0F5C6B]"><Pencil size={15} /></button>
                        <button onClick={() => setConfirmDeleteRecetteId(r.id)} className="text-[#C0392B]"><Trash2 size={15} /></button>
                      </div>
                    )
                  )}
                </div>
              </div>
            )}
          </Card>
        ))}
      </div>
    </div>
  );
}

// ================= PRINT: BILAN =================
function BilanPrint({ periode, gicNom, gicLogo, gicAdresse, totalFacture, totalEncaisse, totalImpayes, depensesDuMois, totalDepenses, resultatNet }) {
  const lignes = depensesDuMois || [];
  return (
    <div className="pdf-page" style={{ fontFamily: "Manrope, sans-serif", padding: "10mm", color: "#14232B", background: "#fff" }}>
      <div style={{ borderBottom: "3px solid #0F5C6B", paddingBottom: 10, marginBottom: 16, display: "flex", alignItems: "center", gap: 12 }}>
        <img src={gicLogo || LOGO_DATA_URI} alt="Logo GIC AEPT" style={{ width: 52, height: 52, objectFit: "contain" }} />
        <div>
          <h1 style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 20, color: "#0F5C6B", margin: 0 }}>{gicNom || "GIC ACTION D'ENTRAIDE POUR TOUS"}</h1>
          <p style={{ fontSize: 11, margin: "4px 0 0" }}>{gicAdresse || "PK19 NGOMA ENTREE CHEFFERIE QUARTIER LAPAIX, DOUALA 3e — Tél: 692248128 / 651694772 / 693255612"}</p>
          <h2 style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 15, marginTop: 6 }}>Bilan financier mensuel — {periodeLabel(periode)}</h2>
        </div>
      </div>

      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, marginBottom: 16 }}>
        <tbody>
          <PrintRow label="Total facturé" value={fmt(totalFacture)} />
          <PrintRow label="Total encaissé" value={fmt(totalEncaisse)} />
          <PrintRow label="Total des impayés" value={fmt(totalImpayes)} />
          <PrintRow label="Total des dépenses (ce mois)" value={fmt(totalDepenses)} strong />
          <PrintRow label="RÉSULTAT NET" value={fmt(resultatNet)} strong big />
        </tbody>
      </table>

      {lignes.length > 0 && (
        <>
          <p style={{ fontSize: 13, fontWeight: 700, color: "#0F5C6B", marginBottom: 4 }}>Détail des dépenses du mois</p>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, marginBottom: 16 }}>
            <thead>
              <tr>
                <th style={thL}>Libellé</th>
                <th style={thL}>Acteur</th>

}

// ================= FICHE DE SUIVI DES ABONNÉS (impression / PDF) =================
// Densité calibrée pour qu'une page A4 (moins l'en-tête) affiche au moins 50 abonnés sans vide en bas de page.
const FICHE_ROWS_PER_PAGE = 65;

function FicheSuiviPrint({ periode, rows, totaux, gicNom, gicLogo, gicAdresse }) {
  const pages = [];
  for (let i = 0; i < rows.length; i += FICHE_ROWS_PER_PAGE) {
    pages.push(rows.slice(i, i + FICHE_ROWS_PER_PAGE));
  }
  if (pages.length === 0) pages.push([]);

  return (
    <>
      {pages.map((pageRows, pageIndex) => (
        <div key={pageIndex} className="pdf-page page-break" style={{ fontFamily: "Manrope, sans-serif", padding: "6mm", color: "#14232B", background: "#fff", minHeight: "277mm" }}>
          <FicheEnTete
            gicNom={gicNom}
            gicLogo={gicLogo}
            gicAdresse={gicAdresse}
            titre={`Fiche de suivi des abonnés — ${periodeLabel(periode)}${pages.length > 1 ? ` (page ${pageIndex + 1}/${pages.length})` : ""}`}
          />

          {pageIndex === 0 && (
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 9, marginBottom: 5 }}>
              <tbody>
                <tr>
                  <td style={{ ...tdL, fontWeight: 700 }}>Total impayés (toutes zones)</td>
                  <td style={{ ...tdR, color: "#C0392B" }}>{fmt(totaux.impayes)}</td>
                  <td style={{ ...tdL, fontWeight: 700 }}>Total facturé (cumulé)</td>
                  <td style={{ ...tdR, color: "#0F5C6B" }}>{fmt(totaux.factures)}</td>
                  <td style={{ ...tdL, fontWeight: 700 }}>Abonnés actifs</td>
                  <td style={{ ...tdR, color: "#2E8B57" }}>{totaux.actifs} / {rows.length}</td>
                </tr>
              </tbody>
            </table>
          )}

          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 8.5 }}>
            <thead>
              <tr>
                <th style={thLFiche}>Abonné</th>
                <th style={thLFiche}>Localisation</th>
                <th style={thRFiche}>Impayés / Avance</th>
                <th style={thRFiche}>Facture (cumul)</th>
                <th style={thLFiche}>Statut</th>
              </tr>
            </thead>
            <tbody>
              {pageRows.map((r, i) => (
                <tr key={i} style={{ background: i % 2 === 1 ? "#F5F8F7" : "#fff" }}>
                  <td style={tdL}>{r.nom}{r.refAbonne ? ` (${r.refAbonne})` : ""}</td>
                  <td style={tdL}>{r.localisation || "—"}</td>
                  <td style={{ ...tdR, color: r.impayesAvance > 0 ? "#C0392B" : "#2E8B57" }}>{fmt(r.impayesAvance)}</td>
                  <td style={tdR}>{fmt(r.factureTotal)}</td>
                  <td style={{ ...tdL, fontWeight: 700, color: r.actif ? "#2E8B57" : "#C0392B" }}>{r.actif ? "Actif" : "Inactif"}</td>
                </tr>
              ))}
            </tbody>
          </table>

          <p style={{ fontSize: 7, color: "#8FA3A3", marginTop: 4 }}>
            Statut basé sur la présence d'un relevé de compteur pour {periodeLabel(periode)} ou {periodeLabel(prevPeriode(periode))}.
          </p>
        </div>
      ))}
    </>
  );
}

// ===== E - RELANCER LES IMPAYES =====
function RelancerImpayes({ abonnes, relevesPeriode, paiements, periode, onClose }) {
  // Calcul direct sans resteAPayer (robuste)
  const impayes = (relevesPeriode || []).map(r => {
      const abonne = (abonnes || []).find(a => a.id === r.abonneId);
      if (!abonne) return null;
      const totalPaye = (paiements || []).filter(p => p.releveId === r.id).reduce((s, p) => s + Number(p.montant || 0), 0);
      const reste = Number(r.montantAPayer || 0) - totalPaye;
      if (reste <= 0) return null;
      return { nom: abonne.nom, ref: abonne.refAbonne || "", zone: abonne.zone || "", montant: reste };
    }).filter(Boolean).sort((a,b) => b.montant - a.montant);

  const total = impayes.reduce((s, i) => s + i.montant, 0);

  const getMessage = () => {
    const lignes = impayes.map(i => "• " + i.nom + " (" + i.ref + ") — " + fmt(i.montant)).join("\n");
    return "*Rappel paiement — " + periodeLabel(periode) + "*\n\n" + lignes + "\n\n*Total : " + fmt(total) + "*\n\nMerci de régulariser.";
  };

  const copier = () => {
    try {
      navigator.clipboard.writeText(getMessage()).then(
        () => alert("✅ Message copié ! Collez-le dans WhatsApp."),
        () => alert("Copiez manuellement le message affiché.")
      );
    } catch(e) { alert("Copiez manuellement le message."); }
  };

  const whatsapp = () => {
    window.open("https://wa.me/?text=" + encodeURIComponent(getMessage()), "_blank");
  };

  return (
    <div className="fixed inset-0 z-50 bg-[#0A1A1F]/80 flex flex-col" onClick={onClose}>
      <div className="mt-auto bg-[#F0F6F5] rounded-t-2xl max-h-[85vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
        <div className="sticky top-0 bg-[#F0F6F5] pt-4 px-4 pb-2 border-b border-[#E2E8E7]">
          <div className="flex items-center justify-between mb-1">
            <h2 className="font-800 text-[16px] text-[#14232B]">📲 Relancer les impayés</h2>
            <button onClick={onClose} className="text-[#5B7070] text-[20px] font-700">✕</button>
          </div>
          <p className="text-[12px] text-[#5B7070]">{impayes.length} abonné(s) · Total : {fmt(total)}</p>
        </div>
        <div className="px-4 py-3 space-y-2">
          {impayes.length === 0 ? (
            <div className="text-center py-8 text-[#5B7070]">
              <p className="text-[32px]">🎉</p>
              <p className="font-700 text-[14px]">Aucun impayé ce mois !</p>
            </div>
          ) : impayes.map((imp, i) => (
            <div key={i} className="bg-white rounded-xl px-3 py-2.5 flex items-center justify-between border border-[#E2E8E7]">
              <div>
                <p className="font-700 text-[13px] text-[#14232B]">{imp.nom}</p>
                <p className="text-[11px] text-[#5B7070]">{imp.ref} · {imp.zone}</p>
              </div>
              <p className="font-800 text-[14px] text-[#C0392B]">{fmt(imp.montant)}</p>
            </div>
          ))}
        </div>
        {impayes.length > 0 && (
          <div className="px-4 pb-6 pt-2 flex gap-2">
            <button onClick={copier} className="flex-1 bg-[#25D366] text-[#14232B] font-700 text-[13px] py-3 rounded-xl active:opacity-80">
              📋 Copier
            </button>
            <button onClick={whatsapp} className="flex-1 bg-[#0F5C6B] text-white font-700 text-[13px] py-3 rounded-xl active:opacity-80">
              📱 WhatsApp
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ================= FICHE DES CLIENTS INSOLVABLES (impression / PDF) — densité ≥ 50 clients/page =================
const DETTE_ROWS_PER_PAGE = 65;

function ClientsInsolvablesPrint({ periode, rows, gicNom, gicLogo, gicAdresse }) {
  const pages = [];
  for (let i = 0; i < rows.length; i += DETTE_ROWS_PER_PAGE) {
    pages.push(rows.slice(i, i + DETTE_ROWS_PER_PAGE));
  }
  if (pages.length === 0) pages.push([]);
  const totalDettes = rows.reduce((s, r) => s + r.dette, 0);
  // Format compact (sans "FCFA" répété sur chaque cellule) pour laisser la place à 3 versements par ligne
  const paiementCell = (p) => (p ? `${fmtDate(p.date)} — ${Number(p.montant || 0).toLocaleString("fr-FR")}` : "—");

  return (
    <>
      {pages.map((pageRows, pageIndex) => (
        <div key={pageIndex} className="pdf-page page-break" style={{ fontFamily: "Manrope, sans-serif", padding: "6mm", color: "#14232B", background: "#fff", minHeight: "277mm" }}>
          <FicheEnTete
            gicNom={gicNom}
            gicLogo={gicLogo}
            gicAdresse={gicAdresse}
            titre={`Fiche des clients insolvables — ${periodeLabel(periode)}${pages.length > 1 ? ` (page ${pageIndex + 1}/${pages.length})` : ""}`}
            sousTitre="Abonnés présentant un solde impayé, avec les 3 derniers versements enregistrés (du plus récent au plus ancien). Montants en FCFA."
          />

          {pageIndex === 0 && (
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 9, marginBottom: 5 }}>
              <tbody>
                <tr>
                  <td style={{ ...tdL, fontWeight: 700 }}>Nombre de clients insolvables</td>
                  <td style={tdR}>{rows.length}</td>
                  <td style={{ ...tdL, fontWeight: 700 }}>Total des dettes</td>
                  <td style={{ ...tdR, color: "#C0392B" }}>{fmt(totalDettes)}</td>
                </tr>
              </tbody>
            </table>
          )}

          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 8.5, tableLayout: "fixed" }}>
            <thead>
              <tr>
                <th style={{ ...thLFiche, width: "19%" }}>Abonné (réf.)</th>
                <th style={{ ...thLFiche, width: "17%" }}>Localisation / Tél.</th>
                <th style={{ ...thRFiche, width: "12%" }}>Dette</th>
                <th style={{ ...thLFiche, width: "17.3%" }}>Dernier versement</th>
                <th style={{ ...thLFiche, width: "17.3%" }}>Avant-dernier</th>
                <th style={{ ...thLFiche, width: "17.4%" }}>Il y a 3 versements</th>
              </tr>
            </thead>
            <tbody>
              {pageRows.map((r, i) => (
                <tr key={r.id || i} style={{ background: i % 2 === 1 ? "#F5F8F7" : "#fff" }}>
                  <td style={{ ...tdL, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.nom}{r.refAbonne ? ` (${r.refAbonne})` : ""}</td>
                  <td style={{ ...tdL, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.localisation || "—"}{r.telephone ? ` · ${r.telephone}` : ""}</td>
                  <td style={{ ...tdR, color: "#C0392B", fontWeight: 700 }}>{fmt(r.dette)}</td>
                  <td style={tdL}>{paiementCell(r.derniersPaiements[0])}</td>
                  <td style={tdL}>{paiementCell(r.derniersPaiements[1])}</td>
                  <td style={tdL}>{paiementCell(r.derniersPaiements[2])}</td>
                </tr>
              ))}
              {pageRows.length === 0 && (
                <tr><td colSpan={6} style={{ ...tdL, textAlign: "center", color: "#8FA3A3" }}>Aucun client insolvable — tous les comptes sont à jour.</td></tr>
              )}
            </tbody>
          </table>

          <p style={{ fontSize: 7, color: "#8FA3A3", marginTop: 4 }}>
            "—" signifie qu'aucun versement n'a encore été enregistré pour cet abonné sur ce rang.
          </p>
        </div>
      ))}
    </>
  );
}

// ================= FICHE DES CLIENTS À SUSPENDRE (impression / PDF) — densité ≥ 50 clients/page =================
function ClientsASuspendrePrint({ periode, rows, gicNom, gicLogo, gicAdresse }) {
  const pages = [];
  for (let i = 0; i < rows.length; i += DETTE_ROWS_PER_PAGE) {
    pages.push(rows.slice(i, i + DETTE_ROWS_PER_PAGE));
  }
  if (pages.length === 0) pages.push([]);
  const totalDettes = rows.reduce((s, r) => s + r.dette, 0);

  return (
    <>
      {pages.map((pageRows, pageIndex) => (
        <div key={pageIndex} className="pdf-page page-break" style={{ fontFamily: "Manrope, sans-serif", padding: "6mm", color: "#14232B", background: "#fff", minHeight: "277mm" }}>
          <FicheEnTete
            gicNom={gicNom}
            gicLogo={gicLogo}
            gicAdresse={gicAdresse}
            titre={`Fiche des clients à suspendre — ${periodeLabel(periode)}${pages.length > 1 ? ` (page ${pageIndex + 1}/${pages.length})` : ""}`}
            sousTitre={`Abonnés dont la dette est supérieure ou égale à ${fmt(SEUIL_SUSPENSION)}.`}
          />

          {pageIndex === 0 && (
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 9, marginBottom: 5 }}>
              <tbody>
                <tr>
                  <td style={{ ...tdL, fontWeight: 700 }}>Nombre de clients à suspendre</td>
                  <td style={tdR}>{rows.length}</td>
                  <td style={{ ...tdL, fontWeight: 700 }}>Total des dettes concernées</td>
                  <td style={{ ...tdR, color: "#C0392B" }}>{fmt(totalDettes)}</td>
                </tr>
              </tbody>
            </table>
          )}

          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 8.5, tableLayout: "fixed" }}>
            <thead>
              <tr>
                <th style={{ ...thLFiche, width: "19%" }}>Abonné (réf.)</th>
                <th style={{ ...thLFiche, width: "13%" }}>N° compteur</th>
                <th style={{ ...thLFiche, width: "20%" }}>Localisation / Tél.</th>
                <th style={{ ...thRFiche, width: "12%" }}>Dette</th>
                <th style={{ ...thLFiche, width: "18%" }}>Suspendu le</th>
                <th style={{ ...thLFiche, width: "18%" }}>Signature agent</th>
              </tr>
            </thead>
            <tbody>
              {pageRows.map((r, i) => (
                <tr key={r.id || i} style={{ background: i % 2 === 1 ? "#F5F8F7" : "#fff" }}>
                  <td style={{ ...tdL, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.nom}{r.refAbonne ? ` (${r.refAbonne})` : ""}</td>
                  <td style={tdL}>{r.numCompteur || "—"}</td>
                  <td style={{ ...tdL, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.localisation || "—"}{r.telephone ? ` · ${r.telephone}` : ""}</td>
                  <td style={{ ...tdR, color: "#C0392B", fontWeight: 700 }}>{fmt(r.dette)}</td>
                  <td style={{ ...tdL, borderBottom: "0.5px solid #999" }}>&nbsp;</td>
                  <td style={{ ...tdL, borderBottom: "0.5px solid #999" }}>&nbsp;</td>
                </tr>
              ))}
              {pageRows.length === 0 && (
                <tr><td colSpan={6} style={{ ...tdL, textAlign: "center", color: "#8FA3A3" }}>Aucun client n'atteint le seuil de suspension pour le moment.</td></tr>
              )}
            </tbody>
          </table>

          <p style={{ fontSize: 7, color: "#8FA3A3", marginTop: 4 }}>
            Seuil de suspension : dette ≥ {fmt(SEUIL_SUSPENSION)}. Liste générée le {new Date().toLocaleDateString("fr-FR")}.
          </p>
        </div>
      ))}
    </>
  );
}

// ================= FICHE DES DÉPENSES (impression / PDF) — police 12 =================
const DEPENSES_ROWS_PER_PAGE = 50; // police 12 sur cette fiche : capacité par page plus faible que les fiches abonnés

function DepensesPrint({ periode, depensesDuMois, totalDepenses, gicNom, gicLogo, gicAdresse }) {
  const lignes = depensesDuMois || [];

  const pages = [];
  for (let i = 0; i < lignes.length; i += DEPENSES_ROWS_PER_PAGE) {
    pages.push(lignes.slice(i, i + DEPENSES_ROWS_PER_PAGE));
  }
  if (pages.length === 0) pages.push([]);

  return (
    <>
      {pages.map((pageLignes, pageIndex) => {
        const isLastPage = pageIndex === pages.length - 1;
        return (
          <div key={pageIndex} className="pdf-page page-break" style={{ fontFamily: "Manrope, sans-serif", padding: "8mm", color: "#14232B", background: "#fff", minHeight: "277mm" }}>
            <FicheEnTete
              gicNom={gicNom}
              gicLogo={gicLogo}
              gicAdresse={gicAdresse}
              titre={`Fiche des dépenses — ${periodeLabel(periode)}${pages.length > 1 ? ` (page ${pageIndex + 1}/${pages.length})` : ""}`}
              sousTitre="Détail des dépenses enregistrées pour la période."
            />

            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
              <thead>
                <tr>
                  <th style={{ ...thLFiche, fontSize: 12 }}>Libellé</th>
                  <th style={{ ...thLFiche, fontSize: 12 }}>Acteur</th>
                  <th style={{ ...thLFiche, fontSize: 12 }}>Date</th>
                  <th style={{ ...thRFiche, fontSize: 12 }}>Montant</th>
                </tr>
              </thead>
              <tbody>
                {pageLignes.map((l, i) => (
                  <tr key={l.id || i} style={{ background: i % 2 === 1 ? "#F5F8F7" : "#fff" }}>
                    <td style={{ ...tdL, fontSize: 12 }}>{l.libelle || "—"}</td>
                    <td style={{ ...tdL, fontSize: 12 }}>{l.acteur || "—"}</td>
                    <td style={{ ...tdL, fontSize: 12 }}>{l.date || "—"}</td>
                    <td style={{ ...tdR, fontSize: 12 }}>{fmt(l.montant)}</td>
                  </tr>
                ))}
                {pageLignes.length === 0 && pageIndex === 0 && (
                  <tr><td colSpan={4} style={{ ...tdL, fontSize: 12, textAlign: "center", color: "#8FA3A3" }}>Aucune dépense enregistrée pour cette période.</td></tr>
                )}
              </tbody>
              {isLastPage && (
                <tfoot>
                  <tr>
                    <td colSpan={3} style={{ ...tdL, fontSize: 12, fontWeight: 700 }}>Total des dépenses du mois</td>
                    <td style={{ ...tdR, fontSize: 12, fontWeight: 700, color: "#C0392B" }}>{fmt(totalDepenses)}</td>
                  </tr>
                </tfoot>
              )}
            </table>

            {isLastPage && <p style={{ fontSize: 9, color: "#8FA3A3", marginTop: 16 }}>Fait à Douala, le {new Date().toLocaleDateString("fr-FR")}</p>}
          </div>
        );
      })}
    </>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);

// ---------- PWA : enregistrement du service worker + invite d'installation Android ----------
(function setupPWA() {
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./service-worker.js")
        .catch((err) => console.warn("Échec d'enregistrement du service worker :", err));
    });
  }

  // Capture l'événement Chrome/Android pour proposer un bouton "Installer l'application"
  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredPrompt = event;
    const btn = document.getElementById("sde-install-btn");
    if (btn) btn.style.display = "flex";
  });

  window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
    const btn = document.getElementById("sde-install-btn");
    if (btn) btn.style.display = "none";
  });

  window.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("sde-install-btn");
    if (!btn) return;
    btn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      btn.style.display = "none";
    });
  });
})();
</script>
