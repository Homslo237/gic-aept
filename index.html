<script>
  function statusDump() {
    var s = window.__loadStatus || {};
    return Object.keys(s).map(function (k) { return "- " + k + " : " + s[k]; }).join("\n");
  }
  function showBootError(title, detail) {
    var box = document.getElementById("boot-error");
    if (!box) return;
    box.style.display = "block";
    box.innerHTML = "<h2>" + title + "</h2>" +
      "<p>Etat des ressources chargees :</p><code>" + statusDump() + "</code>" +
      "<p style='margin-top:12px'><b>Detail technique :</b></p><code>" + (detail || "aucun detail disponible") + "</code>" +
      "<p style='margin-top:12px'>Copie ce detail et envoie-le pour un diagnostic precis.</p>";
  }
  window.addEventListener("error", function (e) {
    var detail = "";
    if (e.error && e.error.stack) detail = e.error.stack;
    else if (e.message) detail = e.message + (e.filename ? " (" + e.filename + ":" + e.lineno + ":" + e.colno + ")" : "");
    else if (e.target && (e.target.src || e.target.href)) detail = "Echec de chargement de : " + (e.target.src || e.target.href);
    var rootEl = document.getElementById("root");
    var appHasRendered = rootEl && rootEl.childElementCount > 0;
    if (appHasRendered) {
      // L'appli tourne deja : on n'affiche pas de bandeau alarmant pour une erreur mineure,
      // on la garde juste consultable dans la console.
      console.warn("Erreur non bloquante (l'appli fonctionne) :", detail || e);
      return;
    }
    showBootError("Erreur de chargement", detail);
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var rootEl = document.getElementById("root");
    if (rootEl && rootEl.childElementCount > 0) {
      console.warn("Promesse rejetee (non bloquante) :", e.reason);
      return;
    }
    showBootError("Erreur (promesse rejetee)", e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
  });
  setTimeout(function () {
    if (!document.getElementById("root").hasChildNodes()) {
      showBootError("L'application ne s'est pas affichee apres 8 secondes", "Aucune erreur JavaScript detectee -- voir l'etat des ressources ci-dessus pour reperer ce qui n'a pas charge.");
    }
  }, 8000);
</script>

// ── MULTI-TENANT : chemin Firestore dynamique par SDE ──
// gicId "gic-aept" → app_data/main (rétro-compatibilité, zéro migration)
// gicId autre       → gics/{gicId}/data/main (nouvelle SDE)
function getDocRef(db, gicId) {
  if (!db) return null;
  if (!gicId || gicId === "gic-aept") {
    return db.collection("app_data").doc("main");
  }
  return db.collection("gics").doc(gicId).collection("data").doc("main");
}

function genDemoId() {
  return "demo_" + Math.random().toString(36).substr(2,9);
}

function buildDemoData() {
  const now = new Date();
  const mois1 = `${now.getFullYear()}-${String(now.getMonth()).padStart(2,"0")}`;  // mois précédent
  const mois2 = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`; // mois en cours

  const abonnes = DEMO_ABONNES_NOMS.map((nom, i) => ({
    id: genDemoId(),
    nom,
    refAbonne: String(i+1).padStart(3,"0"),
    zone: DEMO_ZONES[i % 4],
    localisation: DEMO_LOCALISATION[i % 8],
    compteur: `CPT-${String(100+i+1)}`,
    statut: i < 48 ? "actif" : "suspendu",
    createdAt: new Date().toISOString(),
  }));

  const releves = [];
  const paiements = [];

  abonnes.forEach((a, i) => {
    const ancienM1 = 200 + i * 3;
    const nouveauM1 = ancienM1 + 4 + (i % 5);
    const prix = 500;
    const frais = 500;
    const impayes = i % 7 === 0 ? 3000 : 0;
    const conso = (nouveauM1 - ancienM1) * prix;
    const montant = conso + frais + impayes;

    const r1id = genDemoId();
    releves.push({
      id: r1id, abonneId: a.id, periode: mois1,
      ancienIndex: ancienM1, nouveauIndex: nouveauM1,
      prixUnitaire: prix, fraisEntretien: frais,
      impayesAnterieurs: impayes,
      montantConso: conso, montantAPayer: montant,
      nFacture: `F-${mois1}-${String(i+1).padStart(3,"0")}`,
      createdAt: new Date().toISOString(),
    });

    // 80% des abonnés ont payé le mois précédent
    if (i % 5 !== 0) {
      paiements.push({
        id: genDemoId(), releveId: r1id, abonneId: a.id, periode: mois1,
        montant: montant, date: mois1 + "-15",
        mode: i % 3 === 0 ? "Mobile Money" : "Espèces",
        createdAt: new Date().toISOString(),
      });
    }

    // Mois en cours
    const ancienM2 = nouveauM1;
    const nouveauM2 = ancienM2 + 3 + (i % 6);
    const impayes2 = i % 5 === 0 ? montant : 0;
    const conso2 = (nouveauM2 - ancienM2) * prix;
    const montant2 = conso2 + frais + impayes2;
    const r2id = genDemoId();
    releves.push({
      id: r2id, abonneId: a.id, periode: mois2,
      ancienIndex: ancienM2, nouveauIndex: nouveauM2,
      prixUnitaire: prix, fraisEntretien: frais,
      impayesAnterieurs: impayes2,
      montantConso: conso2, montantAPayer: montant2,
      nFacture: `F-${mois2}-${String(i+1).padStart(3,"0")}`,
      createdAt: new Date().toISOString(),
    });
  });

  const depensesLignes = [
    { id: genDemoId(), libelle: "Maintenance pompe principale", montant: 45000, date: mois1+"-05", periode: mois1, createdAt: new Date().toISOString() },
    { id: genDemoId(), libelle: "Achat tuyaux PVC", montant: 28000, date: mois1+"-12", periode: mois1, createdAt: new Date().toISOString() },
    { id: genDemoId(), libelle: "Carburant groupe électrogène", montant: 15000, date: mois2+"-03", periode: mois2, createdAt: new Date().toISOString() },
    { id: genDemoId(), libelle: "Frais de réunion", montant: 8000, date: mois2+"-08", periode: mois2, createdAt: new Date().toISOString() },
  ];

// ================= INSCRIPTION NOUVELLE SDE =================
function RegisterScreen({ auth, db, onRegistered }) {
  const [step, setStep] = React.useState(1); // 1=infos, 2=compte, 3=succès
  const [form, setForm] = React.useState({
    nomSDE: "", quartier: "", ville: "Douala",
    email: "", password: "", confirm: "", codeParrain: ""
  });
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState("");

  const upd = (k, v) => setForm(f => ({...f, [k]: v}));

  const genGicId = (nom) => {
    return "sde-" + nom.toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]/g,"-")
      .replace(/-+/g,"-").slice(0,20)
      .replace(/-$/,"") + "-" + Date.now().toString(36);
  };

  const submit = async () => {
    setError("");
    if (!form.nomSDE.trim()) { setError("Saisissez le nom de votre SDE."); return; }
    if (!form.email.trim()) { setError("Saisissez votre adresse email."); return; }
    if (form.password.length < 6) { setError("Le mot de passe doit avoir au moins 6 caractères."); return; }
    if (form.password !== form.confirm) { setError("Les mots de passe ne correspondent pas."); return; }

    setLoading(true);
    try {
      // 1. Créer le compte Firebase Auth
      const cred = await auth.createUserWithEmailAndPassword(form.email.trim(), form.password);
      const uid = cred.user.uid;
      const gicId = genGicId(form.nomSDE);

      // 1bis. Programme de parrainage : rattacher le parrain (affilié) si un code valide a été saisi
      // NB : le parrain n'est pas un SDE, c'est un affilié indépendant (collection "affiliates")
      const parrain = await window.Affiliation.trouverParrain(db, form.codeParrain);

      // 2. Créer le profil utilisateur dans users/{uid}
      await db.collection("users").doc(uid).set({
        gicId,
        email: form.email.trim(),
        role: "administrateur",
        nom: form.nomSDE.trim(),
        plan: "starter",
        createdAt: new Date().toISOString(),
        referredByAffiliateId: parrain ? parrain.id : null,
        referralStartDate: parrain ? new Date().toISOString() : null,
      });

      // 3. Initialiser les données SDE dans gics/{gicId}/data/main
      await db.collection("gics").doc(gicId).collection("data").doc("main").set({
        abonnes: [],
        releves: [],
        paiements: [],
        depensesLignes: [],
        recettesDiverses: [],
        params: { prixUnitaire: 500, fraisEntretien: 500, libellesDepenses: ["Maintenance","Matériaux","Carburant","Réunion","Divers"] },
        gicInfo: { nom: form.nomSDE.trim(), quartier: form.quartier.trim() + (form.ville ? ", " + form.ville : ""), logo: null, adresse: form.quartier.trim() + ", " + form.ville },
        zones: ["Zone 1","Zone 2","Zone 3","Zone 4"],
      });

      setStep(3);
      setTimeout(() => onRegistered && onRegistered(), 3000);
    } catch(e) {
      const msg = e && e.code === "auth/email-already-in-use"

          <p style={{ color: "rgba(252,232,184,0.8)", fontSize: 13, marginTop: 12 }}>Créer votre espace SDE gratuit</p>
        </div>

        {/* Étapes */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 28 }}>
          {[1,2].map(s => (
            <React.Fragment key={s}>
              <div style={{
                width: 28, height: 28, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                background: step >= s ? "#00C2CB" : "rgba(255,255,255,0.15)",
                color: step >= s ? "#0A1A1F" : "rgba(255,255,255,0.5)",
                fontSize: 12, fontWeight: 800
              }}>{s}</div>
              {s < 2 && <div style={{ flex: 1, height: 2, background: step > s ? "#00C2CB" : "rgba(255,255,255,0.15)", maxWidth: 60 }} />}
            </React.Fragment>
          ))}
        </div>

        {error && (
          <div style={{ background: "rgba(192,57,43,0.2)", border: "1px solid #C0392B", borderRadius: 10, padding: "10px 14px", marginBottom: 16, color: "#FFB3A7", fontSize: 13 }}>
            ⚠️ {error}
          </div>
        )}

        {/* Étape 1 : Infos SDE */}
        {step === 1 && (
          <div style={{ background: "rgba(255,255,255,0.07)", borderRadius: 16, padding: 20, border: "1px solid rgba(255,255,255,0.12)" }}>
            <h3 style={{ color: "#00C2CB", fontSize: 14, fontWeight: 700, margin: "0 0 16px" }}>📋 Étape 1 — Votre Service de Distribution d'Eau</h3>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Nom de votre SDE *</label>
              <input style={inputStyle} placeholder="Ex: SDE EAU VIVE LOGPOM"
                value={form.nomSDE} onChange={e => upd("nomSDE", e.target.value)} />
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Quartier / Localisation *</label>
              <input style={inputStyle} placeholder="Ex: Logpom, Bonamoussadi..."
                value={form.quartier} onChange={e => upd("quartier", e.target.value)} />
            </div>
            <div style={{ marginBottom: 20 }}>
              <label style={labelStyle}>Ville</label>
              <input style={inputStyle} placeholder="Douala"
                value={form.ville} onChange={e => upd("ville", e.target.value)} />
            </div>
            <button onClick={() => {
              if (!form.nomSDE.trim() || !form.quartier.trim()) { setError("Remplissez le nom et le quartier."); return; }
              setError(""); setStep(2);
            }} style={{
              width: "100%", padding: "13px", borderRadius: 30, border: "none", cursor: "pointer",
              background: "#E8722A", color: "white", fontSize: 14, fontWeight: 800
            }}>Continuer →</button>
          </div>
        )}

        {/* Étape 2 : Compte */}
        {step === 2 && (
          <div style={{ background: "rgba(255,255,255,0.07)", borderRadius: 16, padding: 20, border: "1px solid rgba(255,255,255,0.12)" }}>
            <h3 style={{ color: "#00C2CB", fontSize: 14, fontWeight: 700, margin: "0 0 4px" }}>🔐 Étape 2 — Créer votre compte administrateur</h3>
            <p style={{ color: "rgba(255,255,255,0.5)", fontSize: 11, marginBottom: 16 }}>Pour : <b style={{color:"rgba(252,232,184,0.9)"}}>{form.nomSDE}</b></p>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Adresse email *</label>
              <input style={inputStyle} type="email" placeholder="votre@email.com"
                value={form.email} onChange={e => upd("email", e.target.value)} />
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Mot de passe * (min. 6 caractères)</label>
              <input style={inputStyle} type="password" placeholder="••••••••"
                value={form.password} onChange={e => upd("password", e.target.value)} />
            </div>
            <div style={{ marginBottom: 20 }}>
              <label style={labelStyle}>Confirmer le mot de passe *</label>
              <input style={inputStyle} type="password" placeholder="••••••••"
                value={form.confirm} onChange={e => upd("confirm", e.target.value)} />
            </div>
            <div style={{ marginBottom: 20 }}>
              <label style={labelStyle}>Code du parrain (optionnel)</label>
              <input style={inputStyle} type="text" placeholder="Ex: EAUVIVE-4F2A"
                value={form.codeParrain} onChange={e => upd("codeParrain", e.target.value.toUpperCase())} />
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={() => { setStep(1); setError(""); }} style={{
                flex: 1, padding: "12px", borderRadius: 30, border: "1.5px solid rgba(255,255,255,0.3)",
                background: "transparent", color: "white", fontSize: 13, fontWeight: 700, cursor: "pointer"
              }}>← Retour</button>
              <button onClick={submit} disabled={loading} style={{
                flex: 2, padding: "12px", borderRadius: 30, border: "none", cursor: loading ? "not-allowed" : "pointer",
                background: loading ? "rgba(232,114,42,0.5)" : "#E8722A", color: "white", fontSize: 14, fontWeight: 800
              }}>{loading ? "Création en cours..." : "🚀 Créer mon espace"}</button>
            </div>
          </div>
        )}

        <p style={{ textAlign: "center", color: "rgba(255,255,255,0.4)", fontSize: 11, marginTop: 20, lineHeight: 1.6 }}>
          En créant un compte vous acceptez les conditions d'utilisation.<br/>
          <span style={{color:"rgba(252,232,184,0.6)"}}>Homslo/Vision — Le futur maintenant</span>
        </p>
      </div>
    </div>
  );
}

function LoginScreen({ onLogin, onShowRegister, onBack, onDemo, initError }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [error, setError] = useState("");
  const [checking, setChecking] = useState(false);
  const [resetSent, setResetSent] = useState(false);
  const [resetLoading, setResetLoading] = useState(false);
  const [autoLockMsg] = useState(() => {
    try {
      if (window.sessionStorage.getItem("gic-aept-autolock")) {
        window.sessionStorage.removeItem("gic-aept-autolock");
        return "🔒 Déconnecté automatiquement après 10 min d'inactivité.";
      }
    } catch (e) {}
    return "";
  });

  const translateFirebaseError = (err) => {
    const code = err && err.code;
    if (code === "auth/wrong-password" || code === "auth/invalid-credential" || code === "auth/invalid-login-credentials") return "Email ou mot de passe incorrect.";
    if (code === "auth/user-not-found") return "Aucun compte trouvé avec cet email.";
    if (code === "auth/too-many-requests") return "Trop de tentatives. Patientez quelques minutes.";
    if (code === "auth/network-request-failed") return "Pas de connexion internet.";
    if (code === "auth/invalid-email") return "Adresse email invalide.";
    return "Connexion impossible (" + (code || "erreur inconnue") + ").";
  };

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (!auth) { setError("Firebase non disponible. Vérifiez votre connexion."); return; }
    if (!email.trim()) { setError("Saisissez votre adresse email."); return; }
    if (!password) { setError("Saisissez votre mot de passe."); return; }
    setChecking(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), password);
      // onAuthStateChanged dans App() prend le relais automatiquement
    } catch (e2) {
      setError(translateFirebaseError(e2));
      setChecking(false);
    }
  };

  const sendPasswordReset = async () => {
    if (!email.trim()) { setError("Saisissez d'abord votre email pour recevoir le lien."); return; }
    if (!auth) { setError("Firebase non disponible."); return; }
    setResetLoading(true);
    try {
      await auth.sendPasswordResetEmail(email.trim());
      setResetSent(true);
      setError("");
    } catch(e) {
      setError("Erreur : " + (e && e.message || e));
    }
    setResetLoading(false);
  };

// ================= DÉTECTION ET FUSION DES ABONNÉS EN DOUBLON =================
function DoublonsAbonnes({ abonnes, releves, paiements, onMerge }) {
  const groups = useMemo(() => {
    const byName = {};
    abonnes.forEach((a) => {
      const key = normalizeName(a.nom);
      if (!key) return;
      (byName[key] = byName[key] || []).push(a);
    });
    return Object.values(byName)
      .filter((g) => g.length > 1)
      .map((g) =>
        g
          .map((a) => {
            const relevesA = releves.filter((r) => r.abonneId === a.id);
            const releveIds = new Set(relevesA.map((r) => r.id));
            const nbPaiements = paiements.filter((p) => releveIds.has(p.releveId)).length;
            return { ...a, nbReleves: relevesA.length, nbPaiements };
          })
          .sort((x, y) => y.nbReleves - x.nbReleves) // le plus "rempli" en premier, choix par défaut
      );
  }, [abonnes, releves, paiements]);

  const [keepChoice, setKeepChoice] = useState({}); // { [groupIndex]: abonneId }
  const [confirmIndex, setConfirmIndex] = useState(null);

  if (groups.length === 0) {
    return (
      <Card className="mb-4">
        <p className="text-[13px] text-[#2E8B57] text-center py-2">✓ Aucun doublon de nom détecté parmi les {abonnes.length} abonnés.</p>
      </Card>
    );
  }

  return (
    <Card className="mb-4 !border-2 !border-[#E8A33D]/50">
      <SectionTitle>⚠️ Doublons détectés ({groups.length})</SectionTitle>
      <p className="text-[11px] text-[#5B7070] mb-3">
        Ces abonnés portent le même nom (accents/espaces ignorés) mais ont des fiches séparées — leurs relevés et paiements sont donc dispersés. Choisis la fiche à conserver ; les autres seront fusionnées dedans (relevés et paiements transférés), puis supprimées.
      </p>
      {groups.map((g, gi) => {
        const keepId = keepChoice[gi] || g[0].id;
        const others = g.filter((a) => a.id !== keepId);
        return (
          <div key={gi} className="border border-[#E2E8E7] rounded-xl p-3 mb-3">
            <p className="text-[13px] font-700 mb-2">{g[0].nom}</p>
            {g.map((a) => (
              <label key={a.id} className="flex items-center gap-2 mb-1.5 text-[12px]">
                <input
                  type="radio"
                  name={`doublon-${gi}`}
                  checked={keepId === a.id}
                  onChange={() => { setKeepChoice({ ...keepChoice, [gi]: a.id }); setConfirmIndex(null); }}
                />
                <span className="flex-1">
                  Réf. {a.refAbonne || "—"} · {a.zone} · {a.nbReleves} relevé(s), {a.nbPaiements} paiement(s)
                </span>
              </label>
            ))}
            {confirmIndex === gi ? (
              <div className="flex gap-2 mt-2">
                <button
                  onClick={() => { onMerge(keepId, others.map((a) => a.id)); setConfirmIndex(null); }}
                  className="flex-1 bg-[#E8A33D] text-white rounded-xl py-2 text-[12px] font-700"
                >
                  Confirmer la fusion ({others.length} fiche(s) supprimée(s))
                </button>
                <button onClick={() => setConfirmIndex(null)} className="text-[12px] font-700 text-[#8FA3A3] px-2">Annuler</button>
              </div>
            ) : (
              <button onClick={() => setConfirmIndex(gi)} className="w-full mt-1 text-[12px] font-700 text-[#E8A33D] border border-dashed border-[#E8A33D]/60 rounded-xl py-2">
                Fusionner ce groupe
              </button>
            )}
          </div>
        );
      })}
    </Card>
  );
}

function ResetButton({ onResetData, nombreReleves, nombrePaiements }) {
  const [etape, setEtape] = React.useState(0); // 0=initial 1=confirmation 2=confirmation finale

  if (etape === 0) {
    return (
      <button
        onClick={() => setEtape(1)}
        className="w-full flex items-center justify-center gap-2 bg-[#C0392B] text-white rounded-xl py-3 font-700 text-[13px] active:opacity-80"
      >
        🗑️  Réinitialiser relevés, paiements et dépenses
      </button>
    );
  }
  if (etape === 1) {
    return (
      <div className="bg-[#FCE4E1] rounded-xl p-3">
        <p className="text-[12px] font-700 text-[#C0392B] mb-2">
          Tu es sur le point de supprimer :
        </p>
        <ul className="text-[11px] text-[#14232B] mb-3 pl-3 list-disc">
          <li>{nombreReleves} relevé(s)</li>
          <li>{nombrePaiements} paiement(s)</li>
          <li>Toutes les dépenses enregistrées</li>
        </ul>
        <p className="text-[11px] font-700 text-[#C0392B] mb-3">Cette action est IRRÉVERSIBLE. Confirmes-tu ?</p>
        <div className="flex gap-2">
          <button onClick={() => setEtape(2)} className="flex-1 bg-[#C0392B] text-white rounded-xl py-2.5 font-700 text-[12px] active:opacity-80">
            Oui, je confirme
          </button>
          <button onClick={() => setEtape(0)} className="flex-1 bg-[#F0F6F5] text-[#5B7070] rounded-xl py-2.5 font-700 text-[12px]">
            Annuler
          </button>
        </div>
      </div>
    );
  }
  if (etape === 2) {
    return (
      <div className="bg-[#FCE4E1] rounded-xl p-3">
        <p className="text-[12px] font-700 text-[#C0392B] mb-3">
          ⚠️ DERNIÈRE CONFIRMATION — Toutes les données seront effacées définitivement.
        </p>
        <div className="flex gap-2">
          <button
            onClick={() => { onResetData(); setEtape(0); }}
            className="flex-1 bg-[#C0392B] text-white rounded-xl py-2.5 font-700 text-[12px] active:opacity-80"
          >

function ChangePasswordModal({ onClose, showToast }) {
  const [current, setCurrent] = useState("");
  const [next, setNext] = useState("");
  const [confirm, setConfirm] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const translateFirebaseError = (err) => {
    const code = err && err.code;
    if (code === "auth/wrong-password" || code === "auth/invalid-credential") return "Mot de passe actuel incorrect.";
    if (code === "auth/weak-password") return "Le nouveau mot de passe est trop court (6 caractères minimum).";
    if (code === "auth/network-request-failed") return "Pas de connexion internet. Vérifiez votre réseau.";
    return "Échec de la mise à jour (" + (code || "erreur inconnue") + ").";
  };

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (!current || !next || !confirm) {
      setError("Remplissez tous les champs.");
      return;
    }
    if (next.length < 6) {
      setError("Le nouveau mot de passe doit contenir au moins 6 caractères.");
      return;
    }
    if (next !== confirm) {
      setError("Les deux saisies du nouveau mot de passe ne correspondent pas.");
      return;
    }
    const user = auth && auth.currentUser;
    if (!user) {
      setError("Session expirée, reconnectez-vous.");
      return;
    }
    setBusy(true);
    try {
      const credential = firebase.auth.EmailAuthProvider.credential(user.email, current);
      await user.reauthenticateWithCredential(credential);
      await user.updatePassword(next);
      showToast && showToast("Mot de passe mis à jour ✅");
      onClose();
    } catch (e2) {
      setError(translateFirebaseError(e2));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="fixed inset-0 z-[70] bg-[#14232B]/60 flex items-end sm:items-center justify-center p-4" onClick={onClose}>
      <div className="w-full max-w-xs bg-white rounded-2xl p-4" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">
          <SectionTitle>Changer mon mot de passe</SectionTitle>
          <button onClick={onClose} className="text-[#8FA3A3]"><X size={20} /></button>
        </div>
        <form onSubmit={submit}>
          <Field label="Mot de passe actuel">
            <input type="password" className={inputCls} value={current} onChange={(e) => setCurrent(e.target.value)} autoFocus />
          </Field>
          <Field label="Nouveau mot de passe">
            <input type="password" className={inputCls} value={next} onChange={(e) => setNext(e.target.value)} placeholder="6 caractères minimum" />
          </Field>
          <Field label="Confirmer le nouveau mot de passe">
            <input type="password" className={inputCls} value={confirm} onChange={(e) => setConfirm(e.target.value)} />
          </Field>
          {error && <p className="text-[12px] text-[#C0392B] mb-3">{error}</p>}
          <BigButton type="submit" icon={Lock} color="#14232B">
            {busy ? "Mise à jour…" : "Mettre à jour le mot de passe"}
          </BigButton>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(DEFAULT_DATA);

  const [saving, setSaving] = useState(false);

  const [printTarget, setPrintTarget] = useState(null);

  const [pdfBusy, setPdfBusy] = useState(false);
  const previewRef = useRef(null);
  const [role, setRole] = useState(null);
  const [isDemo, setIsDemo] = useState(false);
  const [gicId, setGicId] = useState("gic-aept"); // ID unique de la SDE connectée

  const [showHistorique, setShowHistorique] = useState(false);
  const [historique, setHistorique] = useState([]);

  // Logger une action dans l'historique de session
  const logAction = React.useCallback((action, detail) => {
    setHistorique(prev => [{
      id: Date.now(),
      date: new Date().toISOString(),
      role: role || "inconnu",
      action,
      detail
    }, ...prev].slice(0, 200));
  }, [role]);
  const [demoData, setDemoData] = useState(null);
  // Source de données active : démo (mémoire) OU réelle (Firebase)
  const activeData = (isDemo && demoData) ? demoData : data;
  const [roleChecked, setRoleChecked] = useState(false);
  const [syncError, setSyncError] = useState("");

  // ---- Session (rôle) : dérivée du compte Firebase réellement connecté ----
  useEffect(() => {
    if (!auth) {
      setRoleChecked(true);
      return;
    }
    const unsub = auth.onAuthStateChanged(async (user) => {
      if (user) {
        try {
          const userRef = db.collection("users").doc(user.uid);
          const userDoc = await userRef.get();
          if (userDoc.exists) {
            const profile = userDoc.data();
            // Compte SDE créé via RegisterScreen ou ancien compte GIC AEPT
            const resolvedRole = profile.role || EMAIL_TO_ROLE[user.email] || "associe";
            const resolvedGicId = profile.gicId || "gic-aept";
            setRole(resolvedRole);
            setGicId(resolvedGicId);
          } else if (EMAIL_TO_ROLE[user.email]) {
            // Ancien compte GIC AEPT sans profil users/ → rétro-compatibilité
            const defaultGicId = "gic-aept";
            await userRef.set({
              gicId: defaultGicId,
              email: user.email,
              role: EMAIL_TO_ROLE[user.email],
              nom: "GIC ACTION D'ENTRAIDE POUR TOUS",
              plan: "starter",
              createdAt: new Date().toISOString(),
            }, { merge: true });
            setRole(EMAIL_TO_ROLE[user.email]);
            setGicId(defaultGicId);
          } else {
            // Compte Firebase sans profil → déconnexion propre
            await auth.signOut();
            setRole(null);
            setGicId(null);
          }
        } catch (e) {
          // Firestore inaccessible → fallback ancien système si email connu
          if (EMAIL_TO_ROLE[user.email]) {
            setRole(EMAIL_TO_ROLE[user.email]);
            setGicId("gic-aept");
          } else {
            setRole(null);
            setGicId(null);
          }
        }
      } else {
        setRole(null);
        setGicId(null);
      }
      setRoleChecked(true);
    });
    return () => unsub();
  }, []);

  const logout = () => {
    if (auth) auth.signOut();
    setTab("dashboard");
  };

  // ---- Verrouillage automatique après 10 minutes d'inactivité ----
  const INACTIVITY_LIMIT_MS = 10 * 60 * 1000;
  const lastActivityRef = useRef(Date.now());
  useEffect(() => {
    if (!role) return; // rien à verrouiller si personne n'est connecté
    const markActive = () => { lastActivityRef.current = Date.now(); };
    const events = ["touchstart", "mousedown", "keydown", "scroll", "wheel"];
    events.forEach((ev) => window.addEventListener(ev, markActive, { passive: true }));
    markActive();
    const check = setInterval(() => {
      if (Date.now() - lastActivityRef.current >= INACTIVITY_LIMIT_MS) {
        try { window.sessionStorage.setItem("gic-aept-autolock", "1"); } catch (e) {}
        logout();
      }
    }, 15000);
    return () => {
      events.forEach((ev) => window.removeEventListener(ev, markActive));
      clearInterval(check);
    };
  }, [role]); // eslint-disable-line

  // ---- Chargement local instantané (cache hors-ligne) puis synchronisation temps réel Firestore ----
  useEffect(() => {
    try {
      const raw = window.localStorage.getItem(`sde-data-${gicId || "gic-aept"}-v1`);
      if (raw) {
        const parsed = JSON.parse(raw);
        setData({
          ...DEFAULT_DATA,
          ...parsed,
          params: { ...DEFAULT_DATA.params, ...(parsed.params || {}) },
          gicInfo: { ...DEFAULT_DATA.gicInfo, ...(parsed.gicInfo || {}) },
        });
      }
    } catch (e) {
      // pas de copie locale disponible : pas grave, Firestore prendra le relais
    }
  }, []);

  useEffect(() => {
    if (!role) {
      setLoaded(true);
      return;
    }
    if (!db) {
      setSyncError("Base de données indisponible sur cet appareil.");
      setLoaded(true);
      return;
    }
    setSyncError("");
    const docRef = getDocRef(db, gicId);
    const unsub = docRef.onSnapshot(
      (snap) => {
        if (snap.exists) {
          const remote = snap.data();
          setData({
            ...DEFAULT_DATA,
            ...remote,
            params: { ...DEFAULT_DATA.params, ...(remote.params || {}) },
            gicInfo: { ...DEFAULT_DATA.gicInfo, ...(remote.gicInfo || {}) },
          });
          try {
            window.localStorage.setItem(`sde-data-${gicId || "gic-aept"}-v1`, JSON.stringify(remote));
          } catch (e) {}
        } else if (role === "administrateur") {
          // Première utilisation : on amorce Firestore avec les données déjà présentes sur ce téléphone
          let seed = DEFAULT_DATA;
          try {
            const raw = window.localStorage.getItem(`sde-data-${gicId || "gic-aept"}-v1`);
            if (raw) seed = { ...DEFAULT_DATA, ...JSON.parse(raw) };
          } catch (e) {}
          docRef.set(seed).catch((e) => setSyncError("Initialisation de la base impossible : " + ((e && e.message) || e)));
        }
        setLoaded(true);
      },
      (err) => {
        setSyncError((err && err.message) || String(err));
        setLoaded(true);
      }
    );
    return () => unsub();
  }, [role, gicId]);

  const persist = useCallback((nextData) => {
    if (isDemo) { setDemoData(nextData); return; }
    setData(nextData);
    setSaving(true);
    try {
      window.localStorage.setItem(`sde-data-${gicId || "gic-aept"}-v1`, JSON.stringify(nextData));
    } catch (e) {
      // cache local indisponible : Firestore reste la source de vérité
    }
    if (db) {
      getDocRef(db, gicId)
        .set(nextData)
        .catch((e) => {
          const denied = e && (e.code === "permission-denied" || /insufficient permissions/i.test(e.message || ""));
          const msg = denied
            ? "⚠️ Enregistrement refusé par la base de données (permissions insuffisantes). Ce compte n'est pas autorisé à écrire — vérifiez les règles Firestore avec l'administrateur."
            : "⚠️ Échec de l'enregistrement en ligne (" + ((e && e.message) || e) + "). Vérifiez votre connexion internet.";
          setToast(msg);
          setTimeout(() => setToast(""), 9000);
        })
        .finally(() => setTimeout(() => setSaving(false), 150));
    } else {
      setTimeout(() => setSaving(false), 150);
    }
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 5000);
  };

  // Import générique : à partir de lignes collées depuis Excel/WhatsApp (voir composant ImportDonnees).
  const importDonnees = useCallback((periodeImport, rows) => {
    const newAbonnes = [];
    const newReleves = [];
    rows.forEach((r) => {
      let abonneId;
      const already = activeData.abonnes.find((a) => (a.refAbonne || "").trim().toUpperCase() === (r.refAbonne || "").trim().toUpperCase());
      if (already) {
        abonneId = already.id;

        abonneId = uid();
        newAbonnes.push({
          id: abonneId,
          refAbonne: r.refAbonne,

          telephone: "",

      newReleves.push({
        id: releveId(abonneId, periodeImport),
        abonneId,
        periode: periodeImport,
        ancienIndex: r.ancien,
        nouveauIndex: r.nouveau,
        consommation: r.nouveau - r.ancien,

        fraisEntretien: r.frais,

        montantConso: r.montantConso,
        montantAPayer: r.montantAPayer,
        numFacture: r.numFacture || "",
      });
    });
    const otherReleves = activeData.releves.filter(
      (existing) => !newReleves.some((nr) => nr.id === existing.id)

  const pdfFileName = () => {

    if (printTarget.type === "suspendre") return `Clients_a_suspendre_${periode}.pdf`;
    if (printTarget.type === "depenses") return `Fiche_depenses_${periode}.pdf`;
  if (printTarget.type === "analyse") return `Rapport_analyse_6mois.pdf`;
  if (printTarget.type === "zone") return `Analyse_par_zone_${periode}.pdf`;
    return `Factures_${printTarget.zone || "zone"}_${periode}.pdf`;

    if (!window.jspdf || !window.jspdf.jsPDF) throw new Error("jsPDF n'est pas chargé (bibliothèque manquante).");

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF("p", "mm", "a4");
    const pageWidthMm = 210, pageHeightMm = 297;
    for (let i = 0; i < pages.length; i++) {
      const canvas = await window.html2canvas(pages[i], { scale: 2, backgroundColor: "#ffffff", useCORS: true });
      const imgData = canvas.toDataURL("image/jpeg", 0.92);
      const imgWidthMm = pageWidthMm;
      const imgHeightMm = (canvas.height * imgWidthMm) / canvas.width;
      if (i > 0) doc.addPage();
      doc.addImage(imgData, "JPEG", 0, 0, imgWidthMm, Math.min(imgHeightMm, pageHeightMm));
    }
    return doc;
  };

        localisation: a.localisation,
        impayesAvance,
        factureTotal,
        actif,
      };
    });
  }, [activeData.abonnes, activeData.releves, resteAPayer, periode]);

  const ficheSuiviTotaux = useMemo(() => {
    return ficheSuiviRows.reduce(
      (acc, r) => ({
        impayes: acc.impayes + (r.impayesAvance > 0 ? r.impayesAvance : 0),
        factures: acc.factures + r.factureTotal,
        actifs: acc.actifs + (r.actif ? 1 : 0),
      }),
      { impayes: 0, factures: 0, actifs: 0 }
    );
  }, [ficheSuiviRows]);

  // ---- Clients endettés : base commune pour les fiches "insolvables" et "à suspendre" ----
  const clientsDetteRows = useMemo(() => {
    return activeData.abonnes
      .map((a) => {
        const relevesAbonne = activeData.releves.filter((r) => r.abonneId === a.id);
        const dette = relevesAbonne.reduce((s, r) => s + resteAPayer(r), 0);
        const releveIds = new Set(relevesAbonne.map((r) => r.id));
        const derniersPaiements = activeData.paiements
          .filter((p) => releveIds.has(p.releveId))
          .slice()
          .sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : 0))
          .slice(0, 3)
          .map((p) => ({ date: p.date, montant: Number(p.montant || 0) }));
        return {
          id: a.id,
          nom: a.nom,
          refAbonne: a.refAbonne,
          zone: a.zone,
          localisation: a.localisation,
          telephone: a.telephone,
          numCompteur: a.numCompteur,
          dette,
          derniersPaiements,
        };
      })
      .filter((r) => r.dette > 0)
      .sort((x, y) => y.dette - x.dette);
  }, [activeData.abonnes, activeData.releves, activeData.paiements, resteAPayer]);

  const clientsInsolvablesRows = clientsDetteRows;
  const clientsASuspendreRows = useMemo(
    () => clientsDetteRows.filter((r) => r.dette >= SEUIL_SUSPENSION),
    [clientsDetteRows]
  );

  const totalFacture = useMemo(() => relevesPeriode.reduce((s, r) => s + Number(r.montantAPayer || 0), 0), [relevesPeriode]);
  // Recettes diverses : argent encaissé qui n'est pas lié à une facture d'eau (pénalité, vente de matériel usagé, etc.)
  const recettesDiverses = (activeData && activeData.recettesDiverses) || [];
  const recettesDiversesDuMois = useMemo(() => recettesDiverses.filter((r) => (r.date || "").startsWith(periode)), [recettesDiverses, periode]);
  const totalRecettesDiversesMois = recettesDiversesDuMois.reduce((s, r) => s + Number(r.montant || 0), 0);
  // Total encaissé du mois = somme des paiements d'eau + recettes diverses, dont la DATE tombe dans le mois sélectionné,
  // qu'ils règlent une facture de ce mois ou une ancienne dette — comme une vraie caisse.
  const totalEncaissePaiements = useMemo(() => {
    return activeData.paiements.filter((p) => (p.date || "").startsWith(periode)).reduce((s, p) => s + Number(p.montant || 0), 0);
  }, [activeData.paiements, periode]);
  const totalEncaisse = totalEncaissePaiements + totalRecettesDiversesMois;
  const totalImpayes = totalFacture - totalEncaissePaiements;

  // Nouveau système de dépenses : liste plate et cumulative (comme les paiements)
  const depensesLignes = (activeData && activeData.depensesLignes) || [];
  const depensesDuMois = useMemo(() => depensesLignes.filter((l) => l.periode === periode), [depensesLignes, periode]);
  const totalDepensesMois = depensesDuMois.reduce((s, l) => s + Number(l.montant || 0), 0);
  const totalDepensesCumul = depensesLignes.reduce((s, l) => s + Number(l.montant || 0), 0);
  const totalDepenses = totalDepensesMois;
  const resultatNet = totalEncaisse - totalDepenses;

  // Calcul analyse par zone (mois courant)
  const zonesData = React.useMemo(() => {
    const zoneMap = {};
    (activeData.abonnes || []).forEach(a => {
      const z = a.zone || "Sans zone";
      if (!zoneMap[z]) zoneMap[z] = { zone: z, nbAbonnes: 0, m3: 0, facture: 0, encaisse: 0 };
      zoneMap[z].nbAbonnes++;
    });
    (activeData.releves || []).filter(r => r.periode === periode).forEach(r => {
      const a = (activeData.abonnes || []).find(ab => ab.id === r.abonneId);
      const z = a?.zone || "Sans zone";
      if (!zoneMap[z]) zoneMap[z] = { zone: z, nbAbonnes: 0, m3: 0, facture: 0, encaisse: 0 };
      zoneMap[z].m3 += Math.max(0, Number(r.nouveauIndex||0) - Number(r.ancienIndex||0));
      zoneMap[z].facture += Number(r.montantAPayer || 0);
    });
    (activeData.paiements || []).filter(p => p.periode === periode).forEach(p => {
      const r = (activeData.releves || []).find(rv => rv.id === p.releveId);
      const a = r ? (activeData.abonnes || []).find(ab => ab.id === r.abonneId) : null;
      const z = a?.zone || "Sans zone";
      if (zoneMap[z]) zoneMap[z].encaisse += Number(p.montant || 0);
    });
    return Object.values(zoneMap).map(z => ({
      ...z,
      taux: z.facture > 0 ? Math.round(z.encaisse / z.facture * 100) : 0,
      impayes: Math.max(0, z.facture - z.encaisse),
    })).sort((a,b) => b.facture - a.facture);
  }, [activeData, periode]);

  // Calcul 6 mois pour le rapport d'analyse
  const data6 = useMemo(() => {
    const now = new Date();
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const p = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      months.push(p);
    }
    return months.map(p => {
      const relevesMois = (activeData.releves || []).filter(r => r.periode === p);
      const m3 = relevesMois.reduce((s, r) => s + Math.max(0, Number(r.nouveauIndex||0) - Number(r.ancienIndex||0)), 0);
      const facture = relevesMois.reduce((s, r) => s + Number(r.montantAPayer||0), 0);
      const encaisse = (activeData.paiements || []).filter(pm => pm.periode === p).reduce((s, pm) => s + Number(pm.montant||0), 0);
      const taux = facture > 0 ? Math.round(encaisse / facture * 100) : 0;
      return { periode: p, m3, facture, encaisse, taux };
    });
  }, [activeData.releves, activeData.paiements]);


  const getImpayesAnterieurs = useCallback(
    (abonneId, periodeRef) => {
      return activeData.releves
        .filter((r) => r.abonneId === abonneId && r.periode < periodeRef)
        .reduce((s, r) => s + resteAPayer(r), 0);
    },
    [activeData.releves, resteAPayer]
  );

  const getAncienIndex = useCallback(
    (abonneId, periodeRef) => {
      const prev = activeData.releves
        .filter((r) => r.abonneId === abonneId && r.periode < periodeRef)
        .sort((a, b) => (a.periode < b.periode ? 1 : -1))[0];
      return prev ? prev.nouveauIndex : 0;
    },
    [activeData.releves]
  );

  if (!loaded || !roleChecked) {
    return (
      <div style={{ fontFamily: "Manrope, sans-serif" }} className="h-screen w-full flex items-center justify-center bg-[#F5F8F7]">
        <div className="flex flex-col items-center gap-3 text-[#0F5C6B]">
          <Loader2 className="animate-spin" size={32} />
          <span className="text-sm font-medium">Chargement des données…</span>
        </div>
      </div>
    );
  }

  if (!role) {
    if (showRegister) {
      return (
        <RegisterScreen
          auth={auth}
          db={db}
          onRegistered={() => setShowRegister(false)}
        />
      );
    }
    if (!showLoginForm) {
      return (
        <WelcomeScreen
          onLogin={() => setShowLoginForm(true)}
          onRegister={() => setShowRegister(true)}
          onDemo={() => {
            logAction("Connexion", "Mode démonstration");
            const d = buildDemoData();
            setDemoData(d);
            setIsDemo(true);
            setRole("administrateur");
          }}
        />
      );
    }
    return <LoginScreen
      initError={firebaseInitError || syncError}
      onShowRegister={() => setShowRegister(true)}
      onBack={() => setShowLoginForm(false)}
      onDemo={() => {
        logAction("Connexion", "Mode démonstration");
        const d = buildDemoData();
        setDemoData(d);
        setIsDemo(true);
        setRole("administrateur");
      }}
    />;
  }

  return (
    <div style={{ fontFamily: "Manrope, sans-serif", background: "linear-gradient(180deg, #0A4655 0%, #12707F 55%, #4FB8C9 100%)" }} className="min-h-screen text-[#14232B] relative">
      <GlobalStyles />
      {/* Fond immersif : une seule couche de bulles, fixe, derrière tout le contenu défilant — pour préserver les performances sur les longues listes */}
      <div className="fixed inset-0 z-0 pointer-events-none">
        <Bubbles opacityMult={0.7} />
      </div>

      {/* ---------- APP (no-print) ---------- */}
      <div className="no-print pb-2 relative z-10">
        <Header periode={periode} setPeriode={setPeriode} saving={saving} gicNom={gicNom} gicLogo={gicLogo} role={role} onLogout={logout} showToast={showToast} onShowHistorique={() => setShowHistorique(true)} />

        {syncError && (
          <div className="max-w-xl mx-auto px-4 mt-3">
            <div className="bg-[#FCE4E1] text-[#C0392B] text-[12px] rounded-xl px-3 py-2">
              ⚠️ Synchronisation impossible : {syncError}. Les données affichées peuvent ne pas être à jour.
            </div>
          </div>
        )}

        <main className="px-4 pt-4 max-w-xl mx-auto">
          {tab === "dashboard" && (
            <Dashboard
              periode={periode}
              totalFacture={totalFacture}
              totalEncaisse={totalEncaisse}
              totalImpayes={totalImpayes}
              totalDepenses={totalDepenses}
              resultatNet={resultatNet}
              onPrint={() => setPrintTarget({ type: "bilan" })}
              onGoToDepenses={() => setTab("depenses")}
              onAnalyse={() => setPrintTarget({ type: "analyse" })}
              onRelancer={() => setShowRelancer(true)}
              onZone={() => setPrintTarget({ type: "zone" })}
            />
          )}

          {tab === "depenses" && (
            <DepensesTab
              periode={periode}
              canManage={canManage}
              canAdd={canAdd}
              depensesLignes={depensesLignes}
              depensesDuMois={depensesDuMois}
              totalDepensesMois={totalDepensesMois}
              totalDepensesCumul={totalDepensesCumul}
              libellesDepenses={libellesDepenses}
              onAddDepense={(l) => {
                persist({ ...activeData, depensesLignes: [l, ...depensesLignes] });
                logAction("Dépense enregistrée", "");
              showToast("Dépense enregistrée");
              }}
              onUpdateDepense={(updated) => {
                persist({ ...activeData, depensesLignes: depensesLignes.map((l) => (l.id === updated.id ? updated : l)) });
                showToast("Dépense modifiée");
              }}
              onDeleteDepense={(id) => {
                persist({ ...activeData, depensesLignes: depensesLignes.filter((l) => l.id !== id) });
                showToast("Dépense supprimée");
              }}
              onPrintDepenses={() => setPrintTarget({ type: "depenses" })}
              onError={showToast}
            />
          )}

          {tab === "abonnes" && (
            <Abonnes
              abonnes={activeData.abonnes}
              zones={zones}
              periode={periode}
              canManage={canManage}
              canAdd={canAdd}
              onImportDonnees={importDonnees}
              onFicheSuivi={() => setPrintTarget({ type: "fiche" })}
              onFicheInsolvables={() => setPrintTarget({ type: "insolvables" })}
              onFicheSuspendre={() => setPrintTarget({ type: "suspendre" })}
              onAdd={(a, abonnement) => {
                if (abonnement && Number(abonnement.montant) > 0) {
                  const periodeAbonnement = prevPeriode(periode); // laisse le mois en cours libre pour le vrai 1er relevé de compteur
                  const rId = releveId(a.id, periodeAbonnement);
                  const montant = Number(abonnement.montant);
                  const avance = Math.min(Number(abonnement.avance) || 0, montant);
                  const nouveauReleve = {
                    id: rId,
                    abonneId: a.id,
                    periode: periodeAbonnement,
                    ancienIndex: 0,
                    nouveauIndex: 0,
                    consommation: 0,
                    prixUnitaire: 0,
                    fraisEntretien: 0,
                    impayesAnterieurs: 0,
                    montantConso: montant,
                    montantAPayer: montant,
                    numFacture: `ABO-${a.refAbonne}`,
                  };
                  const nouveauxPaiements = [];
                  if (avance > 0) {
                    nouveauxPaiements.push({
                      id: uid(),
                      releveId: rId,
                      numFacture: nouveauReleve.numFacture,
                      abonneNom: a.nom,
                      date: todayISO(),
                      montant: avance,
                      mode: "Espèces",
                      caissier: "",
                    });
                  }
                  persist({
                    ...data,
                    abonnes: [...activeData.abonnes, a],
                    releves: [...activeData.releves, nouveauReleve],
                    paiements: [...nouveauxPaiements, ...activeData.paiements],
                  });
                  showToast(
                    avance >= montant
                      ? "Abonné ajouté — frais d'abonnement réglé intégralement"
                      : `Abonné ajouté — reste ${fmt(montant - avance)} sur le frais d'abonnement (ajouté aux impayés)`
                  );
                } else {
                  persist({ ...activeData, abonnes: [...activeData.abonnes, a] });
                  logAction("Abonné ajouté", newA.nom || "");
                showToast("Abonné ajouté");
                }
              }}
              onUpdate={(updated) => {
                persist({ ...activeData, abonnes: activeData.abonnes.map((a) => (a.id === updated.id ? { ...a, ...updated } : a)) });
                showToast("Abonné modifié");
              }}
              onDelete={(id) => {
                persist({ ...activeData, abonnes: activeData.abonnes.filter((a) => a.id !== id) });
                showToast("Abonné supprimé");
              }}
            />
          )}

          {tab === "releve" && (
            <Releve
              periode={periode}
              abonnes={activeData.abonnes}
              zones={zones}
              params={activeData.params}
              isDev={isDev}
              canAdd={canAdd}
              canManage={canManage}
              paiements={activeData.paiements}
              relevesPeriode={relevesPeriode}
              resteAPayer={resteAPayer}
              getAncienIndex={getAncienIndex}
              getImpayesAnterieurs={getImpayesAnterieurs}
              onSaveParams={(params) => persist({ ...activeData, params })}
              onSaveReleve={(r) => {
                const others = activeData.releves.filter((x) => x.id !== r.id);
                const isNew = !activeData.releves.find(x => x.id === r.id);
                persist({ ...activeData, releves: [...others, r] });
                logAction(isNew ? "Relevé enregistré" : "Relevé modifié", r.numFacture || "");
                showToast("Relevé enregistré");
              }}
              onDeleteReleve={(id) => {
                persist({ ...activeData, releves: activeData.releves.filter((r) => r.id !== id) });
                showToast("Relevé supprimé");
              }}
              onError={showToast}
              onGenerateZone={(zone) => {
                const list = activeData.releves
                  .filter((r) => r.periode === periode)
                  .map((r) => ({ r, a: activeData.abonnes.find((a) => a.id === r.abonneId) }))
                  .filter((x) => x.a && x.a.zone === zone);
                if (list.length === 0) {
                  showToast("Aucun relevé pour cette zone ce mois-ci");
                  return;
                }
                setPrintTarget({ type: "factures", list, zone });
              }}
            />
          )}

          {tab === "historique" && (
            <Historique
              abonnes={activeData.abonnes}
              releves={activeData.releves}
              paiements={activeData.paiements}
              resteAPayer={resteAPayer}
              canAdd={canAdd}
              canManage={canManage}
              onAddPaiement={(p) => {
                persist({ ...activeData, paiements: [p, ...activeData.paiements] });
                logAction("Paiement enregistré", fmt(p.montant || 0));
                showToast("Paiement enregistré");
              }}
              onUpdatePaiement={(updated) => {
                persist({ ...activeData, paiements: activeData.paiements.map((p) => (p.id === updated.id ? updated : p)) });
                showToast("Paiement modifié");
              }}
              onDeletePaiement={(id) => {
                persist({ ...activeData, paiements: activeData.paiements.filter((p) => p.id !== id) });
                showToast("Paiement supprimé");
              }}
              recettesDiverses={recettesDiverses}
              onAddRecette={(r) => {
                persist({ ...activeData, recettesDiverses: [r, ...recettesDiverses] });
                showToast("Recette enregistrée");
              }}
              onUpdateRecette={(updated) => {
                persist({ ...activeData, recettesDiverses: recettesDiverses.map((r) => (r.id === updated.id ? updated : r)) });
                showToast("Recette modifiée");
              }}
              onDeleteRecette={(id) => {
                persist({ ...activeData, recettesDiverses: recettesDiverses.filter((r) => r.id !== id) });
                showToast("Recette supprimée");
              }}
              onError={showToast}
            />
          )}
          {tab === "parametres" && isDev && (
            <ParametresTab
              gicInfo={activeData.gicInfo}
              params={activeData.params}
              abonnes={activeData.abonnes}
              releves={activeData.releves}
              paiements={activeData.paiements}
              libellesDepenses={libellesDepenses}
              onSaveGicInfo={(gicInfo) => {
                persist({ ...activeData, gicInfo });
                showToast("Informations du SDE mises à jour");
              }}
              onSaveTarifs={(params) => {
                persist({ ...activeData, params: { ...activeData.params, ...params } });
                showToast("Tarifs mis à jour");
              }}
              onSaveLibelles={(liste) => {
                persist({ ...activeData, params: { ...activeData.params, libellesDepenses: liste } });
                showToast("Libellés de dépenses mis à jour");
              }}
              onMergeAbonnes={(keepId, mergeIds) => {
                const releves = (activeData && activeData.releves).map((r) => (mergeIds.includes(r.abonneId) ? { ...r, abonneId: keepId } : r));
                const abonnes = activeData.abonnes.filter((a) => !mergeIds.includes(a.id));
                persist({ ...activeData, abonnes, releves });
                showToast(`Doublon(s) fusionné(s) — ${mergeIds.length} fiche(s) supprimée(s), historique conservé`);
              }}
              onResetData={() => {
                persist({ ...activeData, releves: [], paiements: [], depenses: [] });
                showToast("Réinitialisation effectuée — relevés, paiements et dépenses supprimés");
              }}
            />
          )}

          {/* Espaceur de sécurité : garantit que le dernier élément d'une liste/formulaire
              n'est jamais masqué par la barre d'onglets flottante, quel que soit l'appareil. */}
          <div style={{ height: 110 }} aria-hidden="true" />
        </main>

        {showHistorique && (
          <HistoriqueActions
            historique={historique}
            onClose={() => setShowHistorique(false)}
          />
        )}
        {showRelancer && (
          <RelancerImpayes
            abonnes={activeData.abonnes || []}
            relevesPeriode={relevesPeriode || []}
            paiements={activeData.paiements || []}
            periode={periode}
            onClose={() => setShowRelancer(false)}
          />
        )}
        {isDemo && (
          <div style={{
            background: "#E8A33D", color: "#14232B", fontWeight: 700,
            fontSize: 12, textAlign: "center", padding: "7px 16px",
            display: "flex", alignItems: "center", justifyContent: "space-between",
            flexShrink: 0, zIndex: 50,
          }}>
            <span>🎯 MODE DÉMONSTRATION — Données fictives GIC EAU VIVE</span>
            <button
              onClick={() => { setIsDemo(false); setDemoData(null); setRole(null); setShowLoginForm(false); }}
              style={{ background: "#14232B", color: "#fff", border: "none",
                borderRadius: 8, padding: "3px 10px", fontSize: 11, cursor: "pointer", fontWeight: 700 }}
            >Quitter</button>
          </div>
        )}
        <TabBar tab={tab} setTab={setTab} isDev={isDev} />

        {toast && (
          <div
            className="fixed bottom-24 left-1/2 -translate-x-1/2 bg-[#14232B] text-white text-sm px-4 py-2.5 shadow-lg z-50"
            style={{ borderRadius: "14px", maxWidth: "88vw", textAlign: "center", whiteSpace: "normal" }}
          >
            {toast}
          </div>
        )}
      </div>

      {/* ---------- APERÇU / IMPRESSION (visible à l'écran, pas seulement au moment d'imprimer) ---------- */}
      {printTarget && (
        <div className="print-overlay fixed inset-0 z-[60] bg-[#14232B]/60 overflow-y-auto">
          <div className="no-print sticky top-0 z-10 bg-white border-b border-[#E2E8E7] px-3 py-3 flex flex-wrap items-center justify-between gap-2 shadow-sm">
            <p className="text-[13px] font-700 text-[#14232B] w-full sm:w-auto">Aperçu — {pdfFileName().replace(".pdf", "")}</p>
            <div className="flex items-center gap-2 flex-wrap">
              <button disabled={pdfBusy} onClick={downloadPdf} className="bg-[#E8A33D] text-[#14232B] text-[12px] font-700 rounded-lg px-3 py-2 flex items-center gap-1.5 disabled:opacity-50">
                {pdfBusy ? <Loader2 size={15} className="animate-spin" /> : <Download size={15} />} PDF
              </button>
              <button disabled={pdfBusy} onClick={sharePdf} className="bg-[#2E8B57] text-white text-[12px] font-700 rounded-lg px-3 py-2 flex items-center gap-1.5 disabled:opacity-50">
                <Share2 size={15} /> Partager
              </button>
              <button onClick={() => window.print()} className="bg-[#0F5C6B] text-white text-[12px] font-700 rounded-lg px-3 py-2 flex items-center gap-1.5">
                <Printer size={15} /> Imprimer
              </button>
              <button onClick={() => setPrintTarget(null)} className="bg-[#F0F6F5] text-[#14232B] text-[12px] font-700 rounded-lg px-3 py-2">
                Fermer
              </button>
            </div>
          </div>
          <div ref={previewRef} className="print-preview bg-white max-w-2xl mx-auto shadow-xl">
            {printTarget.type === "bilan" && (
              <BilanPrint
                periode={periode}
                gicNom={gicNom}
                gicLogo={gicLogo}
                gicAdresse={gicAdresse}
                totalFacture={totalFacture}
                totalEncaisse={totalEncaisse}
                totalImpayes={totalImpayes}
                depensesDuMois={depensesDuMois}
                totalDepenses={totalDepenses}
                resultatNet={resultatNet}
              />
            )}
            {printTarget.type === "factures" &&
              printTarget.list.map(({ r, a }) => <FacturePrint key={r.id} r={r} a={a} gicNom={gicNom} gicLogo={gicLogo} />)}
            {printTarget.type === "fiche" && (
              <FicheSuiviPrint periode={periode} rows={ficheSuiviRows} totaux={ficheSuiviTotaux} gicNom={gicNom} gicLogo={gicLogo} gicAdresse={gicAdresse} />
            )}
            {printTarget.type === "insolvables" && (

  const totalEnc = zonesData.reduce((s,z) => s + z.encaisse, 0);
  const moyTaux = totalFac > 0 ? Math.round(totalEnc / totalFac * 100) : 0;
  const colorTaux = (t) => t >= 80 ? "#2E8B57" : t >= 50 ? "#E8A33D" : "#C0392B";

  return (
    <div style={{background:"#fff", padding:"16px", fontFamily:"sans-serif", maxWidth:"600px", margin:"0 auto"}}>
      <div style={{display:"flex", alignItems:"center", borderBottom:"2px solid #0F5C6B", paddingBottom:"10px", marginBottom:"14px"}}>

          <div style={{fontSize:11, color:"#5B7070"}}>Analyse par zone — {periodeLabel(periode)}</div>
          {gicAdresse && <div style={{fontSize:9, color:"#8AACAC"}}>{gicAdresse}</div>}
        </div>
      </div>

      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:14}}>
        {[
          {label:"Zones actives", val: zonesData.length, color:"#0F5C6B"},
          {label:"Total M³", val: totalM3.toLocaleString() + " m³", color:"#0F5C6B"},
          {label:"Taux moyen", val: moyTaux + "%", color: colorTaux(moyTaux)},
        ].map((k,i) => (
          <div key={i} style={{border:"1px solid #E2E8E7", borderRadius:8, padding:8, textAlign:"center"}}>
            <div style={{fontSize:8, color:"#5B7070", marginBottom:3}}>{k.label}</div>
            <div style={{fontSize:13, fontWeight:800, color:k.color}}>{k.val}</div>
          </div>

      </div>

      <table style={{width:"100%", borderCollapse:"collapse", fontSize:10, marginBottom:12}}>
        <thead>
          <tr style={{background:"#0F5C6B", color:"white"}}>
            {["Zone","Abonnés","M³","Facturé","Encaissé","Impayés","Taux"].map(h => (
              <th key={h} style={{padding:"5px 4px", textAlign:"center", fontWeight:700}}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {zonesData.map((z, i) => (
            <tr key={i} style={{background: i%2===0 ? "#F8FBFB" : "#fff"}}>
              <td style={{padding:"4px", fontWeight:700, color:"#14232B"}}>{z.zone}</td>
              <td style={{padding:"4px", textAlign:"center"}}>{z.nbAbonnes}</td>
              <td style={{padding:"4px", textAlign:"right", color:"#0F5C6B", fontWeight:700}}>{z.m3.toLocaleString()}</td>
              <td style={{padding:"4px", textAlign:"right"}}>{z.facture.toLocaleString()}</td>
              <td style={{padding:"4px", textAlign:"right", color:"#2E8B57"}}>{z.encaisse.toLocaleString()}</td>
              <td style={{padding:"4px", textAlign:"right", color:"#C0392B"}}>{z.impayes.toLocaleString()}</td>
              <td style={{padding:"4px", textAlign:"center", fontWeight:800, color:colorTaux(z.taux)}}>
                {z.facture > 0 ? z.taux + "%" : "—"}

            </tr>

        <tfoot>
          <tr style={{background:"#14232B", color:"white", fontWeight:700}}>
            <td style={{padding:"5px 4px"}}>TOTAL</td>
            <td style={{padding:"5px 4px", textAlign:"center"}}>{zonesData.reduce((s,z)=>s+z.nbAbonnes,0)}</td>

            <td style={{padding:"5px 4px", textAlign:"center"}}>{moyTaux}%</td>
          </tr>
        </tfoot>
      </table>

        <strong>💡 Insights :</strong>{" "}
        {zonesData.length > 0 && (() => {
          const best = zonesData.reduce((a,b) => a.taux >= b.taux ? a : b);

function BarChartSVG({ data, color = "#0F5C6B", unit = "m³" }) {
  const max = Math.max(...data.map(d => d.val), 1);
  const W = 310, H = 150, pad = 28, barW = 32, gap = (W - pad*2 - barW*6) / 5;
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block"}}>
      {data.map((d, i) => {
        const x = pad + i * (barW + gap);
        const barH = Math.max(3, Math.round((d.val / max) * (H - 55)));
        const y = H - 30 - barH;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={barH} rx="4" fill={color} opacity="0.85" />
            <text x={x + barW/2} y={y - 4} textAnchor="middle" fontSize="9" fill="#14232B" fontWeight="700">
              {d.val > 0 ? d.val.toLocaleString() : "—"}
            </text>
            <text x={x + barW/2} y={H - 14} textAnchor="middle" fontSize="9" fill="#5B7070" fontWeight="600">
              {d.label}
            </text>
          </g>
        );
      })}
      <text x={W/2} y={H - 2} textAnchor="middle" fontSize="8" fill="#8AACAC">{unit}</text>
    </svg>
  );
}

function LineChartSVG({ data }) {
  const W = 310, H = 130, pad = 28;
  const spacingX = (W - pad*2) / 5;
  const pts = data.map((d, i) => ({
    x: pad + i * spacingX,
    y: H - 30 - Math.round((Math.min(d.val, 100) / 100) * (H - 50)),
    val: d.val,
    label: d.label
  }));
  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x},${p.y}`).join(" ");
  const colorFor = (v) => v >= 80 ? "#2E8B57" : v >= 50 ? "#E8A33D" : "#C0392B";
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block"}}>
      {[0, 25, 50, 75, 100].map(pct => {
        const y = H - 30 - Math.round((pct / 100) * (H - 50));
        return (
          <g key={pct}>
            <line x1={pad} y1={y} x2={W - pad} y2={y} stroke="#E2E8E7" strokeWidth="1" />
            <text x={pad - 4} y={y + 3} textAnchor="end" fontSize="8" fill="#8AACAC">{pct}%</text>
          </g>
        );
      })}
      <path d={pathD} fill="none" stroke="#0F5C6B" strokeWidth="2" strokeLinejoin="round" />
      {pts.map((p, i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="5" fill={colorFor(data[i].val)} stroke="white" strokeWidth="1.5" />
          <text x={p.x} y={p.y - 8} textAnchor="middle" fontSize="9" fill={colorFor(data[i].val)} fontWeight="700">
            {data[i].val > 0 ? data[i].val + "%" : "—"}
          </text>
          <text x={p.x} y={H - 14} textAnchor="middle" fontSize="9" fill="#5B7070" fontWeight="600">
            {p.label}
          </text>
        </g>
      ))}
    </svg>
  );
}

function JaugeCirculaire({ taux }) {
  const r = 44, cx = 54, cy = 54;
  const circ = 2 * Math.PI * r;
  const pct = Math.min(Math.max(taux, 0), 100);
  const dash = (pct / 100) * circ;
  const color = pct >= 80 ? "#2E8B57" : pct >= 50 ? "#E8A33D" : "#C0392B";
  return (
    <svg width="108" height="108" viewBox="0 0 108 108">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#E2E8E7" strokeWidth="10" />
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth="10"
        strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
        transform={`rotate(-90 ${cx} ${cy})`} style={{transition:"stroke-dasharray 0.6s ease"}} />
      <text x={cx} y={cy - 6} textAnchor="middle" fontSize="20" fontWeight="800" fill={color}>{pct}%</text>
      <text x={cx} y={cy + 10} textAnchor="middle" fontSize="8" fill="#5B7070">recouvrement</text>
    </svg>
  );
}
