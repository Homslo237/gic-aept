<script>
  function statusDump() {
    var s = window.__loadStatus || {};
    return Object.keys(s).map(function (k) { return "- " + k + " : " + s[k]; }).join("\n");
  }
  function showBootError(title, detail) {
    var box = document.getElementById("boot-error");
    if (!box) return;
    box.style.display = "block";
    box.innerHTML = "<h2>" + title + "</h2>" +
      "<p>Etat des ressources chargees :</p><code>" + statusDump() + "</code>" +
      "<p style='margin-top:12px'><b>Detail technique :</b></p><code>" + (detail || "aucun detail disponible") + "</code>" +
      "<p style='margin-top:12px'>Copie ce detail et envoie-le pour un diagnostic precis.</p>";
  }
  window.addEventListener("error", function (e) {
    var detail = "";
    if (e.error && e.error.stack) detail = e.error.stack;
    else if (e.message) detail = e.message + (e.filename ? " (" + e.filename + ":" + e.lineno + ":" + e.colno + ")" : "");
    else if (e.target && (e.target.src || e.target.href)) detail = "Echec de chargement de : " + (e.target.src || e.target.href);
    var rootEl = document.getElementById("root");
    var appHasRendered = rootEl && rootEl.childElementCount > 0;
    if (appHasRendered) {
      // L'appli tourne deja : on n'affiche pas de bandeau alarmant pour une erreur mineure,
      // on la garde juste consultable dans la console.
      console.warn("Erreur non bloquante (l'appli fonctionne) :", detail || e);
      return;
    }
    showBootError("Erreur de chargement", detail);
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var rootEl = document.getElementById("root");
    if (rootEl && rootEl.childElementCount > 0) {
      console.warn("Promesse rejetee (non bloquante) :", e.reason);
      return;
    }
    showBootError("Erreur (promesse rejetee)", e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
  });
  setTimeout(function () {
    if (!document.getElementById("root").hasChildNodes()) {
      showBootError("L'application ne s'est pas affichee apres 8 secondes", "Aucune erreur JavaScript detectee -- voir l'etat des ressources ci-dessus pour reperer ce qui n'a pas charge.");
    }
  }, 8000);
</script>

// ── MULTI-TENANT : chemin Firestore dynamique par SDE ──
// gicId "gic-aept" → app_data/main (rétro-compatibilité, zéro migration)
// gicId autre       → gics/{gicId}/data/main (nouvelle SDE)
function getDocRef(db, gicId) {
  if (!db) return null;
  if (!gicId || gicId === "gic-aept") {
    return db.collection("app_data").doc("main");
  }
  return db.collection("gics").doc(gicId).collection("data").doc("main");
}

// ================= INSCRIPTION NOUVELLE SDE =================
function RegisterScreen({ auth, db, onRegistered }) {
  const [step, setStep] = React.useState(1); // 1=infos, 2=compte, 3=succès
  const [codeParrainDepuisLien] = React.useState(() => Boolean(new URLSearchParams(window.location.search).get("ref")));
  const [form, setForm] = React.useState(() => {
    // Pré-remplissage automatique du code parrain si l'inscription vient d'un lien de parrainage (?ref=CODE)
    const refDepuisLien = new URLSearchParams(window.location.search).get("ref") || "";
    return {
      nomSDE: "", quartier: "", ville: "Douala",
      email: "", password: "", confirm: "", codeParrain: refDepuisLien.toUpperCase()
    };
  });
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState("");

  const upd = (k, v) => setForm(f => ({...f, [k]: v}));

  const genGicId = (nom) => {
    return "sde-" + nom.toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]/g,"-")
      .replace(/-+/g,"-").slice(0,20)
      .replace(/-$/,"") + "-" + Date.now().toString(36);
  };

  const submit = async () => {
    setError("");
    if (!form.nomSDE.trim()) { setError("Saisissez le nom de votre SDE."); return; }
    if (!form.email.trim()) { setError("Saisissez votre adresse email."); return; }
    if (form.password.length < 6) { setError("Le mot de passe doit avoir au moins 6 caractères."); return; }
    if (form.password !== form.confirm) { setError("Les mots de passe ne correspondent pas."); return; }

    setLoading(true);
    try {
      // 1. Créer le compte Firebase Auth
      const cred = await auth.createUserWithEmailAndPassword(form.email.trim(), form.password);
      const uid = cred.user.uid;
      const gicId = genGicId(form.nomSDE);

      // 1bis. Programme de parrainage : rattacher le parrain (affilié) si un code valide a été saisi
      // NB : le parrain n'est pas un SDE, c'est un affilié indépendant (collection "affiliates")
      const parrain = await window.Affiliation.trouverParrain(db, form.codeParrain);

      // 2. Créer le profil utilisateur dans users/{uid}
      await db.collection("users").doc(uid).set({
        gicId,
        email: form.email.trim(),
        role: "administrateur",
        nom: form.nomSDE.trim(),
        plan: "starter",
        createdAt: new Date().toISOString(),
        referredByAffiliateId: parrain ? parrain.id : null,
        referralStartDate: parrain ? new Date().toISOString() : null,
      });

      // 3. Initialiser les données SDE dans gics/{gicId}/data/main
      await db.collection("gics").doc(gicId).collection("data").doc("main").set({
        abonnes: [],
        releves: [],
        paiements: [],
        depensesLignes: [],
        recettesDiverses: [],
        params: { prixUnitaire: 500, fraisEntretien: 500, libellesDepenses: ["Maintenance","Matériaux","Carburant","Réunion","Divers"] },

          <div style={{ background: "rgba(255,255,255,0.07)", borderRadius: 16, padding: 20, border: "1px solid rgba(255,255,255,0.12)" }}>
            <h3 style={{ color: "#00C2CB", fontSize: 14, fontWeight: 700, margin: "0 0 16px" }}>📋 Étape 1 — Votre Service de Distribution d'Eau</h3>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Nom de votre SDE *</label>
              <input style={inputStyle} placeholder="Ex: SDE EAU VIVE LOGPOM"
                value={form.nomSDE} onChange={e => upd("nomSDE", e.target.value)} />
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Quartier / Localisation *</label>
              <input style={inputStyle} placeholder="Ex: Logpom, Bonamoussadi..."
                value={form.quartier} onChange={e => upd("quartier", e.target.value)} />
            </div>
            <div style={{ marginBottom: 20 }}>
              <label style={labelStyle}>Ville</label>
              <input style={inputStyle} placeholder="Douala"
                value={form.ville} onChange={e => upd("ville", e.target.value)} />
            </div>
            <button onClick={() => {
              if (!form.nomSDE.trim() || !form.quartier.trim()) { setError("Remplissez le nom et le quartier."); return; }
              setError(""); setStep(2);
            }} style={{
              width: "100%", padding: "13px", borderRadius: 30, border: "none", cursor: "pointer",
              background: "#E8722A", color: "white", fontSize: 14, fontWeight: 800
            }}>Continuer →</button>
          </div>
        )}

        {/* Étape 2 : Compte */}
        {step === 2 && (
          <div style={{ background: "rgba(255,255,255,0.07)", borderRadius: 16, padding: 20, border: "1px solid rgba(255,255,255,0.12)" }}>
            <h3 style={{ color: "#00C2CB", fontSize: 14, fontWeight: 700, margin: "0 0 4px" }}>🔐 Étape 2 — Créer votre compte administrateur</h3>
            <p style={{ color: "rgba(255,255,255,0.5)", fontSize: 11, marginBottom: 16 }}>Pour : <b style={{color:"rgba(252,232,184,0.9)"}}>{form.nomSDE}</b></p>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Adresse email *</label>
              <input style={inputStyle} type="email" placeholder="votre@email.com"
                value={form.email} onChange={e => upd("email", e.target.value)} />
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Mot de passe * (min. 6 caractères)</label>
              <input style={inputStyle} type="password" placeholder="••••••••"
                value={form.password} onChange={e => upd("password", e.target.value)} />
            </div>
            <div style={{ marginBottom: 20 }}>
              <label style={labelStyle}>Confirmer le mot de passe *</label>
              <input style={inputStyle} type="password" placeholder="••••••••"
                value={form.confirm} onChange={e => upd("confirm", e.target.value)} />
            </div>
            <div style={{ marginBottom: 20 }}>
              <label style={labelStyle}>Code du parrain (optionnel)</label>
              <input style={inputStyle} type="text" placeholder="Ex: EAUVIVE-4F2A"
                value={form.codeParrain} onChange={e => upd("codeParrain", e.target.value.toUpperCase())} />
              {form.codeParrain && codeParrainDepuisLien && (
                <p style={{ fontSize: 12, color: "#2E9BB0", marginTop: 6 }}>✓ Code de parrainage détecté automatiquement depuis le lien</p>
              )}
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={() => { setStep(1); setError(""); }} style={{
                flex: 1, padding: "12px", borderRadius: 30, border: "1.5px solid rgba(255,255,255,0.3)",
                background: "transparent", color: "white", fontSize: 13, fontWeight: 700, cursor: "pointer"
              }}>← Retour</button>
              <button onClick={submit} disabled={loading} style={{
                flex: 2, padding: "12px", borderRadius: 30, border: "none", cursor: loading ? "not-allowed" : "pointer",
                background: loading ? "rgba(232,114,42,0.5)" : "#E8722A", color: "white", fontSize: 14, fontWeight: 800
              }}>{loading ? "Création en cours..." : "🚀 Créer mon espace"}</button>
            </div>
          </div>
        )}

        <p style={{ textAlign: "center", color: "rgba(255,255,255,0.4)", fontSize: 11, marginTop: 20, lineHeight: 1.6 }}>
          En créant un compte vous acceptez les conditions d'utilisation.<br/>
          <span style={{color:"rgba(252,232,184,0.6)"}}>Homslo/Vision — Le futur maintenant</span>
        </p>
      </div>
    </div>
  );
}

function LoginScreen({ onLogin, onShowRegister, onBack, onDemo, initError }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [error, setError] = useState("");
  const [checking, setChecking] = useState(false);
  const [resetSent, setResetSent] = useState(false);
  const [resetLoading, setResetLoading] = useState(false);
  const [autoLockMsg] = useState(() => {
    try {
      if (window.sessionStorage.getItem("gic-aept-autolock")) {
        window.sessionStorage.removeItem("gic-aept-autolock");
        return "🔒 Déconnecté automatiquement après 10 min d'inactivité.";
      }
    } catch (e) {}
    return "";
  });

  const translateFirebaseError = (err) => {
    const code = err && err.code;
    if (code === "auth/wrong-password" || code === "auth/invalid-credential" || code === "auth/invalid-login-credentials") return "Email ou mot de passe incorrect.";
    if (code === "auth/user-not-found") return "Aucun compte trouvé avec cet email.";
    if (code === "auth/too-many-requests") return "Trop de tentatives. Patientez quelques minutes.";
    if (code === "auth/network-request-failed") return "Pas de connexion internet.";
    if (code === "auth/invalid-email") return "Adresse email invalide.";
    return "Connexion impossible (" + (code || "erreur inconnue") + ").";
  };

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (!auth) { setError("Firebase non disponible. Vérifiez votre connexion."); return; }
    if (!email.trim()) { setError("Saisissez votre adresse email."); return; }
    if (!password) { setError("Saisissez votre mot de passe."); return; }
    setChecking(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), password);
      // onAuthStateChanged dans App() prend le relais automatiquement
    } catch (e2) {
      setError(translateFirebaseError(e2));
      setChecking(false);
    }
  };

  const sendPasswordReset = async () => {
    if (!email.trim()) { setError("Saisissez d'abord votre email pour recevoir le lien."); return; }
    if (!auth) { setError("Firebase non disponible."); return; }
    setResetLoading(true);
    try {
      await auth.sendPasswordResetEmail(email.trim());
      setResetSent(true);
      setError("");

      setError("Erreur : " + (e && e.message || e));

// ================= PARAMÈTRES (réservé au Développeur) =================
// ================= DÉTECTION ET FUSION DES ABONNÉS EN DOUBLON =================
function DoublonsAbonnes({ abonnes, releves, paiements, onMerge }) {
  const groups = useMemo(() => {
    const byName = {};
    abonnes.forEach((a) => {
      const key = normalizeName(a.nom);
      if (!key) return;
      (byName[key] = byName[key] || []).push(a);
    });
    return Object.values(byName)
      .filter((g) => g.length > 1)
      .map((g) =>
        g
          .map((a) => {
            const relevesA = releves.filter((r) => r.abonneId === a.id);
            const releveIds = new Set(relevesA.map((r) => r.id));
            const nbPaiements = paiements.filter((p) => releveIds.has(p.releveId)).length;
            return { ...a, nbReleves: relevesA.length, nbPaiements };
          })
          .sort((x, y) => y.nbReleves - x.nbReleves) // le plus "rempli" en premier, choix par défaut
      );
  }, [abonnes, releves, paiements]);

  const [keepChoice, setKeepChoice] = useState({}); // { [groupIndex]: abonneId }
  const [confirmIndex, setConfirmIndex] = useState(null);

  if (groups.length === 0) {
    return (
      <Card className="mb-4">
        <p className="text-[13px] text-[#2E8B57] text-center py-2">✓ Aucun doublon de nom détecté parmi les {abonnes.length} abonnés.</p>
      </Card>
    );
  }

  return (
    <Card className="mb-4 !border-2 !border-[#E8A33D]/50">
      <SectionTitle>⚠️ Doublons détectés ({groups.length})</SectionTitle>
      <p className="text-[11px] text-[#5B7070] mb-3">
        Ces abonnés portent le même nom (accents/espaces ignorés) mais ont des fiches séparées — leurs relevés et paiements sont donc dispersés. Choisis la fiche à conserver ; les autres seront fusionnées dedans (relevés et paiements transférés), puis supprimées.
      </p>
      {groups.map((g, gi) => {
        const keepId = keepChoice[gi] || g[0].id;
        const others = g.filter((a) => a.id !== keepId);
        return (
          <div key={gi} className="border border-[#E2E8E7] rounded-xl p-3 mb-3">
            <p className="text-[13px] font-700 mb-2">{g[0].nom}</p>
            {g.map((a) => (
              <label key={a.id} className="flex items-center gap-2 mb-1.5 text-[12px]">
                <input
                  type="radio"
                  name={`doublon-${gi}`}
                  checked={keepId === a.id}
                  onChange={() => { setKeepChoice({ ...keepChoice, [gi]: a.id }); setConfirmIndex(null); }}
                />
                <span className="flex-1">
                  Réf. {a.refAbonne || "—"} · {a.zone} · {a.nbReleves} relevé(s), {a.nbPaiements} paiement(s)
                </span>
              </label>
            ))}
            {confirmIndex === gi ? (
              <div className="flex gap-2 mt-2">
                <button
                  onClick={() => { onMerge(keepId, others.map((a) => a.id)); setConfirmIndex(null); }}
                  className="flex-1 bg-[#E8A33D] text-white rounded-xl py-2 text-[12px] font-700"
                >
                  Confirmer la fusion ({others.length} fiche(s) supprimée(s))
                </button>
                <button onClick={() => setConfirmIndex(null)} className="text-[12px] font-700 text-[#8FA3A3] px-2">Annuler</button>
              </div>
            ) : (
              <button onClick={() => setConfirmIndex(gi)} className="w-full mt-1 text-[12px] font-700 text-[#E8A33D] border border-dashed border-[#E8A33D]/60 rounded-xl py-2">
                Fusionner ce groupe
              </button>
            )}
          </div>
        );
      })}
    </Card>
  );
}

// ================= CHANGER MON MOT DE PASSE (accessible à tous les profils connectés) =================
function ChangePasswordModal({ onClose, showToast }) {
  const [current, setCurrent] = useState("");
  const [next, setNext] = useState("");
  const [confirm, setConfirm] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const translateFirebaseError = (err) => {
    const code = err && err.code;
    if (code === "auth/wrong-password" || code === "auth/invalid-credential") return "Mot de passe actuel incorrect.";
    if (code === "auth/weak-password") return "Le nouveau mot de passe est trop court (6 caractères minimum).";
    if (code === "auth/network-request-failed") return "Pas de connexion internet. Vérifiez votre réseau.";
    return "Échec de la mise à jour (" + (code || "erreur inconnue") + ").";
  };

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (!current || !next || !confirm) {
      setError("Remplissez tous les champs.");
      return;
    }
    if (next.length < 6) {
      setError("Le nouveau mot de passe doit contenir au moins 6 caractères.");
      return;
    }
    if (next !== confirm) {
      setError("Les deux saisies du nouveau mot de passe ne correspondent pas.");
      return;
    }
    const user = auth && auth.currentUser;
    if (!user) {
      setError("Session expirée, reconnectez-vous.");
      return;
    }
    setBusy(true);
    try {
      const credential = firebase.auth.EmailAuthProvider.credential(user.email, current);
      await user.reauthenticateWithCredential(credential);
      await user.updatePassword(next);
      showToast && showToast("Mot de passe mis à jour ✅");
      onClose();
    } catch (e2) {
      setError(translateFirebaseError(e2));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="fixed inset-0 z-[70] bg-[#14232B]/60 flex items-end sm:items-center justify-center p-4" onClick={onClose}>
      <div className="w-full max-w-xs bg-white rounded-2xl p-4" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">
          <SectionTitle>Changer mon mot de passe</SectionTitle>
          <button onClick={onClose} className="text-[#8FA3A3]"><X size={20} /></button>
        </div>
        <form onSubmit={submit}>
          <Field label="Mot de passe actuel">
            <input type="password" className={inputCls} value={current} onChange={(e) => setCurrent(e.target.value)} autoFocus />
          </Field>
          <Field label="Nouveau mot de passe">
            <input type="password" className={inputCls} value={next} onChange={(e) => setNext(e.target.value)} placeholder="6 caractères minimum" />
          </Field>
          <Field label="Confirmer le nouveau mot de passe">
            <input type="password" className={inputCls} value={confirm} onChange={(e) => setConfirm(e.target.value)} />
          </Field>
          {error && <p className="text-[12px] text-[#C0392B] mb-3">{error}</p>}
          <BigButton type="submit" icon={Lock} color="#14232B">
            {busy ? "Mise à jour…" : "Mettre à jour le mot de passe"}
          </BigButton>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(DEFAULT_DATA);
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [periode, setPeriode] = useState(currentPeriode());
  const [printTarget, setPrintTarget] = useState(null);
  const [toast, setToast] = useState("");
  const [pdfBusy, setPdfBusy] = useState(false);
  const previewRef = useRef(null);
  const [role, setRole] = useState(null);
  const [plan, setPlan] = useState("starter");
  const [planConfig, setPlanConfig] = useState(null); // null tant que non chargé -> on utilise les valeurs de secours
  const [isDemo, setIsDemo] = useState(false);
  const [gicId, setGicId] = useState("gic-aept"); // ID unique de la SDE connectée
  const [showRelancer, setShowRelancer] = useState(false);
  const [showRegister, setShowRegister] = useState(false);
  const [showLoginForm, setShowLoginForm] = useState(false); // false = WelcomeScreen, true = LoginScreen
  const [showZone, setShowZone] = useState(false);
  const [showHistorique, setShowHistorique] = useState(false);
  const [historique, setHistorique] = useState([]);

  // Logger une action dans l'historique de session
  const logAction = React.useCallback((action, detail) => {
    setHistorique(prev => [{
      id: Date.now(),
      date: new Date().toISOString(),
      role: role || "inconnu",
      action,
      detail
    }, ...prev].slice(0, 200));
  }, [role]);
  const [demoData, setDemoData] = useState(null);
  // Source de données active : démo (mémoire) OU réelle (Firebase)
  const activeData = (isDemo && demoData) ? demoData : data;
  const [roleChecked, setRoleChecked] = useState(false);
  const [syncError, setSyncError] = useState("");

  // ---- Session (rôle) : dérivée du compte Firebase réellement connecté ----
  useEffect(() => {
    if (!auth) {
      setRoleChecked(true);
      return;
    }
    const unsub = auth.onAuthStateChanged(async (user) => {
      if (user) {
        try {
          const userRef = db.collection("users").doc(user.uid);
          const userDoc = await userRef.get();
          if (userDoc.exists) {
            const profile = userDoc.data();
            // Compte SDE créé via RegisterScreen ou ancien compte GIC AEPT
            const resolvedRole = profile.role || EMAIL_TO_ROLE[user.email] || "associe";
            const resolvedGicId = profile.gicId || "gic-aept";
            setRole(resolvedRole);
            setGicId(resolvedGicId);
            setPlan(profile.plan || "starter");
          } else if (EMAIL_TO_ROLE[user.email]) {
            // Ancien compte GIC AEPT sans profil users/ → rétro-compatibilité
            const defaultGicId = "gic-aept";
            await userRef.set({
              gicId: defaultGicId,
              email: user.email,
              role: EMAIL_TO_ROLE[user.email],
              nom: "GIC ACTION D'ENTRAIDE POUR TOUS",
              plan: "starter",
              createdAt: new Date().toISOString(),
            }, { merge: true });
            setRole(EMAIL_TO_ROLE[user.email]);
            setGicId(defaultGicId);
            setPlan("starter");
          } else {
            // Compte Firebase sans profil → déconnexion propre
            await auth.signOut();
            setRole(null);
            setGicId(null);
          }
        } catch (e) {
          // Firestore inaccessible → fallback ancien système si email connu
          if (EMAIL_TO_ROLE[user.email]) {
            setRole(EMAIL_TO_ROLE[user.email]);
            setGicId("gic-aept");
          } else {
            setRole(null);
            setGicId(null);
          }
        }
      } else {
        setRole(null);
        setGicId(null);
      }
      setRoleChecked(true);
    });
    return () => unsub();
  }, []);

  const logout = () => {
    if (auth) auth.signOut();
    setTab("dashboard");
  };

  // ---- Verrouillage automatique après 10 minutes d'inactivité ----
  const INACTIVITY_LIMIT_MS = 10 * 60 * 1000;
  const lastActivityRef = useRef(Date.now());
  useEffect(() => {
    if (!role) return; // rien à verrouiller si personne n'est connecté
    const markActive = () => { lastActivityRef.current = Date.now(); };
    const events = ["touchstart", "mousedown", "keydown", "scroll", "wheel"];
    events.forEach((ev) => window.addEventListener(ev, markActive, { passive: true }));
    markActive();
    const check = setInterval(() => {
      if (Date.now() - lastActivityRef.current >= INACTIVITY_LIMIT_MS) {
        try { window.sessionStorage.setItem("gic-aept-autolock", "1"); } catch (e) {}
        logout();
      }
    }, 15000);
    return () => {
      events.forEach((ev) => window.removeEventListener(ev, markActive));
      clearInterval(check);
    };
  }, [role]); // eslint-disable-line

  // ---- Chargement local instantané (cache hors-ligne) puis synchronisation temps réel Firestore ----
  useEffect(() => {
    try {
      const raw = window.localStorage.getItem(`sde-data-${gicId || "gic-aept"}-v1`);
      if (raw) {
        const parsed = JSON.parse(raw);
        setData({
          ...DEFAULT_DATA,
          ...parsed,
          params: { ...DEFAULT_DATA.params, ...(parsed.params || {}) },
          gicInfo: { ...DEFAULT_DATA.gicInfo, ...(parsed.gicInfo || {}) },
        });
      }
    } catch (e) {
      // pas de copie locale disponible : pas grave, Firestore prendra le relais
    }
  }, []);

  useEffect(() => {
    if (!role) {
      setLoaded(true);
      return;
    }
    if (isDemo) {
      // Le mode démonstration ne doit jamais toucher à Firestore (données 100% locales et fictives).
      setSyncError("");
      setLoaded(true);
      return;
    }
    if (!db) {
      setSyncError("Base de données indisponible sur cet appareil.");
      setLoaded(true);
      return;
    }
    setSyncError("");
    const docRef = getDocRef(db, gicId);
    const unsub = docRef.onSnapshot(
      (snap) => {
        if (snap.exists) {
          const remote = snap.data();
          setData({
            ...DEFAULT_DATA,
            ...remote,
            params: { ...DEFAULT_DATA.params, ...(remote.params || {}) },
            gicInfo: { ...DEFAULT_DATA.gicInfo, ...(remote.gicInfo || {}) },
          });
          try {
            window.localStorage.setItem(`sde-data-${gicId || "gic-aept"}-v1`, JSON.stringify(remote));
          } catch (e) {}
        } else if (role === "administrateur") {
          // Première utilisation : on amorce Firestore avec les données déjà présentes sur ce téléphone
          let seed = DEFAULT_DATA;
          try {
            const raw = window.localStorage.getItem(`sde-data-${gicId || "gic-aept"}-v1`);
            if (raw) seed = { ...DEFAULT_DATA, ...JSON.parse(raw) };
          } catch (e) {}
          docRef.set(seed).catch((e) => setSyncError("Initialisation de la base impossible : " + ((e && e.message) || e)));
        }
        setLoaded(true);
      },
      (err) => {
        setSyncError((err && err.message) || String(err));
        setLoaded(true);
      }
    );
    return () => unsub();
  }, [role, gicId, isDemo]);

  // Écoute en direct de la configuration des tarifs (modifiable par Jacques depuis admin.html).
  // isDemo exclu : le mode démonstration ne touche jamais à Firestore.
  useEffect(() => {
    if (!role || isDemo || !db) return;
    const unsub = db.collection("config").doc("plans").onSnapshot(
      (doc) => setPlanConfig(doc.exists ? doc.data() : null),
      () => setPlanConfig(null) // en cas d'erreur, on retombe sur les valeurs de secours
    );
    return () => unsub();
  }, [role, isDemo, db]);

  // Limite et libellé du plan actuel : config Firebase en priorité, sinon valeurs de secours.
  // Attention : "illimité" est stocké comme `null` dans Firebase, qu'il faut convertir
  // en Infinity ici — sinon `null` vaudrait 0 dans une comparaison et bloquerait le plan Premium.
  let limitePlanActuel = planConfig?.[plan]?.limite;
  if (limitePlanActuel === undefined) limitePlanActuel = PLAN_LIMITS[plan] ?? PLAN_LIMITS.starter;
  if (limitePlanActuel === null) limitePlanActuel = Infinity;
  const labelPlanActuel = planConfig?.[plan]?.label || PLAN_LABELS[plan] || plan;

  const persist = useCallback((nextData) => {
    if (isDemo) { setDemoData(nextData); return; }
    setData(nextData);
    setSaving(true);
    try {
      window.localStorage.setItem(`sde-data-${gicId || "gic-aept"}-v1`, JSON.stringify(nextData));
    } catch (e) {
      // cache local indisponible : Firestore reste la source de vérité
    }
    if (db) {
      getDocRef(db, gicId)
        .set(nextData)
        .catch((e) => {
          const denied = e && (e.code === "permission-denied" || /insufficient permissions/i.test(e.message || ""));
          const msg = denied
            ? "⚠️ Enregistrement refusé par la base de données (permissions insuffisantes). Ce compte n'est pas autorisé à écrire — vérifiez les règles Firestore avec l'administrateur."
            : "⚠️ Échec de l'enregistrement en ligne (" + ((e && e.message) || e) + "). Vérifiez votre connexion internet.";
          setToast(msg);
          setTimeout(() => setToast(""), 9000);
        })
        .finally(() => setTimeout(() => setSaving(false), 150));
    } else {
      setTimeout(() => setSaving(false), 150);
    }
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 5000);
  };

  // Import générique : à partir de lignes collées depuis Excel/WhatsApp (voir composant ImportDonnees).
  const importDonnees = useCallback((periodeImport, rows) => {
    const limite = limitePlanActuel;
    const nbNouveauxAbonnesPotentiels = rows.filter(
      (r) => !activeData.abonnes.some((a) => (a.refAbonne || "").trim().toUpperCase() === (r.refAbonne || "").trim().toUpperCase())
    ).length;
    if (activeData.abonnes.length + nbNouveauxAbonnesPotentiels > limite) {
      showToast(`Import annulé : votre plan ${labelPlanActuel} est limité à ${limite} abonnés (vous en avez ${activeData.abonnes.length}, cet import en ajouterait ${nbNouveauxAbonnesPotentiels}). Passez à un plan supérieur.`);
      return;
    }
    const newAbonnes = [];
    const newReleves = [];
    rows.forEach((r) => {
      let abonneId;
      const already = activeData.abonnes.find((a) => (a.refAbonne || "").trim().toUpperCase() === (r.refAbonne || "").trim().toUpperCase());
      if (already) {
        abonneId = already.id;
      } else {
        abonneId = uid();
        newAbonnes.push({
          id: abonneId,
          refAbonne: r.refAbonne,
          nom: r.nom,
          zone: "Zone 1",
          localisation: r.localisation || "",
          numCompteur: r.numCompteur || "",
          telephone: "",
          statut: "Actif",
        });
      }
      newReleves.push({
        id: releveId(abonneId, periodeImport),

    if (!window.html2canvas) throw new Error("html2canvas n'est pas chargé (bibliothèque manquante).");
    if (!window.jspdf || !window.jspdf.jsPDF) throw new Error("jsPDF n'est pas chargé (bibliothèque manquante).");
    const container = previewRef.current;
    if (!container) throw new Error("Aucun contenu à exporter (aperçu introuvable).");
    const pages = container.querySelectorAll(".pdf-page");
    if (pages.length === 0) throw new Error("Aucune page trouvée dans l'aperçu à convertir en PDF.");
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF("p", "mm", "a4");
    const pageWidthMm = 210, pageHeightMm = 297;
    for (let i = 0; i < pages.length; i++) {
      const canvas = await window.html2canvas(pages[i], { scale: 2, backgroundColor: "#ffffff", useCORS: true });
      const imgData = canvas.toDataURL("image/jpeg", 0.92);
      const imgWidthMm = pageWidthMm;
      const imgHeightMm = (canvas.height * imgWidthMm) / canvas.width;
      if (i > 0) doc.addPage();
      doc.addImage(imgData, "JPEG", 0, 0, imgWidthMm, Math.min(imgHeightMm, pageHeightMm));
    }
    return doc;
  };

      zoneMap[z].m3 += Math.max(0, Number(r.nouveauIndex||0) - Number(r.ancienIndex||0));

                showToast("Paiement supprimé");
              }}
              recettesDiverses={recettesDiverses}
              onAddRecette={(r) => {
                persist({ ...activeData, recettesDiverses: [r, ...recettesDiverses] });
                showToast("Recette enregistrée");
              }}
              onUpdateRecette={(updated) => {
                persist({ ...activeData, recettesDiverses: recettesDiverses.map((r) => (r.id === updated.id ? updated : r)) });
                showToast("Recette modifiée");
              }}
              onDeleteRecette={(id) => {
                persist({ ...activeData, recettesDiverses: recettesDiverses.filter((r) => r.id !== id) });
                showToast("Recette supprimée");
              }}
              onError={showToast}
            />
          )}
          {tab === "parametres" && isDev && (
            <ParametresTab
              gicInfo={activeData.gicInfo}
              params={activeData.params}
              abonnes={activeData.abonnes}
              releves={activeData.releves}
              paiements={activeData.paiements}
              libellesDepenses={libellesDepenses}
              onSaveGicInfo={(gicInfo) => {
                persist({ ...activeData, gicInfo });
                showToast("Informations du SDE mises à jour");
              }}
              onSaveTarifs={(params) => {
                persist({ ...activeData, params: { ...activeData.params, ...params } });
                showToast("Tarifs mis à jour");
              }}
              onSaveLibelles={(liste) => {
                persist({ ...activeData, params: { ...activeData.params, libellesDepenses: liste } });
                showToast("Libellés de dépenses mis à jour");
              }}
              onMergeAbonnes={(keepId, mergeIds) => {
                const releves = (activeData && activeData.releves).map((r) => (mergeIds.includes(r.abonneId) ? { ...r, abonneId: keepId } : r));
                const abonnes = activeData.abonnes.filter((a) => !mergeIds.includes(a.id));
                persist({ ...activeData, abonnes, releves });
                showToast(`Doublon(s) fusionné(s) — ${mergeIds.length} fiche(s) supprimée(s), historique conservé`);
              }}
              onResetData={() => {
                persist({ ...activeData, releves: [], paiements: [], depenses: [] });
                showToast("Réinitialisation effectuée — relevés, paiements et dépenses supprimés");
              }}
            />
          )}

          {/* Espaceur de sécurité : garantit que le dernier élément d'une liste/formulaire
              n'est jamais masqué par la barre d'onglets flottante, quel que soit l'appareil. */}
          <div style={{ height: 110 }} aria-hidden="true" />
        </main>

        {showHistorique && (
          <HistoriqueActions
            historique={historique}
            onClose={() => setShowHistorique(false)}
          />
        )}
        {showRelancer && (
          <RelancerImpayes
            abonnes={activeData.abonnes || []}
            relevesPeriode={relevesPeriode || []}
            paiements={activeData.paiements || []}
            periode={periode}

        )}
        <TabBar tab={tab} setTab={setTab} isDev={isDev} />

        {toast && (

            className="fixed bottom-24 left-1/2 -translate-x-1/2 bg-[#14232B] text-white text-sm px-4 py-2.5 shadow-lg z-50"

          </div>

      </div>

      {/* ---------- APERÇU / IMPRESSION (visible à l'écran, pas seulement au moment d'imprimer) ---------- */}
      {printTarget && (
        <div className="print-overlay fixed inset-0 z-[60] bg-[#14232B]/60 overflow-y-auto">
          <div className="no-print sticky top-0 z-10 bg-white border-b border-[#E2E8E7] px-3 py-3 flex flex-wrap items-center justify-between gap-2 shadow-sm">

            <div className="flex items-center gap-2 flex-wrap">
              <button disabled={pdfBusy} onClick={downloadPdf} className="bg-[#E8A33D] text-[#14232B] text-[12px] font-700 rounded-lg px-3 py-2 flex items-center gap-1.5 disabled:opacity-50">

function RapportZonePrint({ zonesData, periode, gicNom, gicLogo, gicAdresse }) {
  const totalM3 = zonesData.reduce((s,z) => s + z.m3, 0);
  const totalFac = zonesData.reduce((s,z) => s + z.facture, 0);
  const totalEnc = zonesData.reduce((s,z) => s + z.encaisse, 0);
  const moyTaux = totalFac > 0 ? Math.round(totalEnc / totalFac * 100) : 0;
  const colorTaux = (t) => t >= 80 ? "#2E8B57" : t >= 50 ? "#E8A33D" : "#C0392B";

  return (
    <div style={{background:"#fff", padding:"16px", fontFamily:"sans-serif", maxWidth:"600px", margin:"0 auto"}}>
      <div style={{display:"flex", alignItems:"center", borderBottom:"2px solid #0F5C6B", paddingBottom:"10px", marginBottom:"14px"}}>
        {gicLogo && <img src={gicLogo} style={{height:40, marginRight:10, objectFit:"contain"}} />}
        <div>
          <div style={{fontSize:14, fontWeight:800, color:"#0F5C6B"}}>{gicNom}</div>
          <div style={{fontSize:11, color:"#5B7070"}}>Analyse par zone — {periodeLabel(periode)}</div>
          {gicAdresse && <div style={{fontSize:9, color:"#8AACAC"}}>{gicAdresse}</div>}
        </div>
      </div>

      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:14}}>
        {[
          {label:"Zones actives", val: zonesData.length, color:"#0F5C6B"},
          {label:"Total M³", val: totalM3.toLocaleString() + " m³", color:"#0F5C6B"},
          {label:"Taux moyen", val: moyTaux + "%", color: colorTaux(moyTaux)},
        ].map((k,i) => (
          <div key={i} style={{border:"1px solid #E2E8E7", borderRadius:8, padding:8, textAlign:"center"}}>
            <div style={{fontSize:8, color:"#5B7070", marginBottom:3}}>{k.label}</div>
            <div style={{fontSize:13, fontWeight:800, color:k.color}}>{k.val}</div>
          </div>
        ))}
      </div>

      <table style={{width:"100%", borderCollapse:"collapse", fontSize:10, marginBottom:12}}>
        <thead>
          <tr style={{background:"#0F5C6B", color:"white"}}>
            {["Zone","Abonnés","M³","Facturé","Encaissé","Impayés","Taux"].map(h => (
              <th key={h} style={{padding:"5px 4px", textAlign:"center", fontWeight:700}}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {zonesData.map((z, i) => (
            <tr key={i} style={{background: i%2===0 ? "#F8FBFB" : "#fff"}}>
              <td style={{padding:"4px", fontWeight:700, color:"#14232B"}}>{z.zone}</td>
              <td style={{padding:"4px", textAlign:"center"}}>{z.nbAbonnes}</td>
              <td style={{padding:"4px", textAlign:"right", color:"#0F5C6B", fontWeight:700}}>{z.m3.toLocaleString()}</td>
              <td style={{padding:"4px", textAlign:"right"}}>{z.facture.toLocaleString()}</td>

          const best = zonesData.reduce((a,b) => a.taux >= b.taux ? a : b);
          const worst = zonesData.filter(z => z.facture > 0).reduce((a,b) => a.taux <= b.taux ? a : b, zonesData[0]);
          const topM3 = zonesData.reduce((a,b) => a.m3 >= b.m3 ? a : b);
          return `Meilleur payeur : ${best.zone} (${best.taux}%) · Plus gros consommateur : ${topM3.zone} (${topM3.m3} m³)${worst && worst.zone !== best.zone ? ` · À surveiller : ${worst.zone} (${worst.taux}%)` : ""}`;
        })()}
      </div>
      <PrintFooterHV />
    </div>
  );
}

function BarChartSVG({ data, color = "#0F5C6B", unit = "m³" }) {
  const max = Math.max(...data.map(d => d.val), 1);
  const W = 310, H = 150, pad = 28, barW = 32, gap = (W - pad*2 - barW*6) / 5;
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block"}}>
      {data.map((d, i) => {
        const x = pad + i * (barW + gap);
        const barH = Math.max(3, Math.round((d.val / max) * (H - 55)));
        const y = H - 30 - barH;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={barH} rx="4" fill={color} opacity="0.85" />
            <text x={x + barW/2} y={y - 4} textAnchor="middle" fontSize="9" fill="#14232B" fontWeight="700">
              {d.val > 0 ? d.val.toLocaleString() : "—"}
            </text>
            <text x={x + barW/2} y={H - 14} textAnchor="middle" fontSize="9" fill="#5B7070" fontWeight="600">
              {d.label}
            </text>
          </g>
        );
      })}
      <text x={W/2} y={H - 2} textAnchor="middle" fontSize="8" fill="#8AACAC">{unit}</text>
    </svg>
  );
}

function LineChartSVG({ data }) {
  const W = 310, H = 130, pad = 28;
  const spacingX = (W - pad*2) / 5;
  const pts = data.map((d, i) => ({
    x: pad + i * spacingX,
    y: H - 30 - Math.round((Math.min(d.val, 100) / 100) * (H - 50)),
    val: d.val,
    label: d.label
  }));
  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x},${p.y}`).join(" ");
  const colorFor = (v) => v >= 80 ? "#2E8B57" : v >= 50 ? "#E8A33D" : "#C0392B";
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block"}}>
      {[0, 25, 50, 75, 100].map(pct => {
        const y = H - 30 - Math.round((pct / 100) * (H - 50));
        return (
          <g key={pct}>
            <line x1={pad} y1={y} x2={W - pad} y2={y} stroke="#E2E8E7" strokeWidth="1" />
            <text x={pad - 4} y={y + 3} textAnchor="end" fontSize="8" fill="#8AACAC">{pct}%</text>
          </g>
        );
      })}
      <path d={pathD} fill="none" stroke="#0F5C6B" strokeWidth="2" strokeLinejoin="round" />
      {pts.map((p, i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="5" fill={colorFor(data[i].val)} stroke="white" strokeWidth="1.5" />
          <text x={p.x} y={p.y - 8} textAnchor="middle" fontSize="9" fill={colorFor(data[i].val)} fontWeight="700">
            {data[i].val > 0 ? data[i].val + "%" : "—"}
          </text>
          <text x={p.x} y={H - 14} textAnchor="middle" fontSize="9" fill="#5B7070" fontWeight="600">
            {p.label}
          </text>
        </g>
      ))}
    </svg>
  );
}

function JaugeCirculaire({ taux }) {
  const r = 44, cx = 54, cy = 54;
  const circ = 2 * Math.PI * r;
  const pct = Math.min(Math.max(taux, 0), 100);
  const dash = (pct / 100) * circ;
  const color = pct >= 80 ? "#2E8B57" : pct >= 50 ? "#E8A33D" : "#C0392B";
  return (
    <svg width="108" height="108" viewBox="0 0 108 108">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#E2E8E7" strokeWidth="10" />
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth="10"
        strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
        transform={`rotate(-90 ${cx} ${cy})`} style={{transition:"stroke-dasharray 0.6s ease"}} />
      <text x={cx} y={cy - 6} textAnchor="middle" fontSize="20" fontWeight="800" fill={color}>{pct}%</text>
      <text x={cx} y={cy + 10} textAnchor="middle" fontSize="8" fill="#5B7070">recouvrement</text>
    </svg>
  );
}

    if (!form.libelle.trim()) { onError && onError("Indiquez le libellé de la dépense."); return; }

      periode,

// ================= IMPORT DE DONNÉES (copier-coller depuis Excel/WhatsApp) =================
// Ordre des colonnes attendu (identique à l'import des 94 abonnés de Juin 2026) :
// Référence | Nom | N° compteur | Localisation | N° facture | Ancien index | Nouveau index
// | Prix unitaire | Frais entretien | Impayés antérieurs | Montant conso | Montant à payer
function parseImportText(text) {
  const lines = text.split(/\r?\n/).map((l) => l.trim()).filter((l) => l.length > 0);
  const valid = [];
  const invalid = [];
  const toNum = (v) => {
    const n = Number(String(v == null ? "" : v).replace(/[\s\u00A0]/g, "").replace(",", "."));
    return isNaN(n) ? null : n;
  };
  lines.forEach((line, idx) => {
    let cols = line.includes("\t") ? line.split("\t") : line.includes(";") ? line.split(";") : line.split(",");
    cols = cols.map((c) => c.trim());
    // Ignore une éventuelle ligne d'en-tête (ex: "Référence, Nom, ...")
    if (idx === 0 && cols[0] && /r[ée]f|nom/i.test(cols[0]) && toNum(cols[0]) === null) return;
    if (cols.length < 7) {
      invalid.push({ ligne: idx + 1, raw: line, motif: `${cols.length} colonne(s) trouvée(s), au moins 7 attendues` });
      return;
    }
    const [refAbonne, nom, numCompteur, localisation, numFacture, ancienStr, nouveauStr, prixStr, fraisStr, impayesStr, montantConsoStr, montantAPayerStr] = cols;
    const ancien = toNum(ancienStr);
    const nouveau = toNum(nouveauStr);
    if (!refAbonne || !nom || ancien === null || nouveau === null) {
      invalid.push({ ligne: idx + 1, raw: line, motif: "Référence, nom, ancien ou nouveau index illisible" });
      return;
    }
    const prix = toNum(prixStr) ?? 0;
    const frais = toNum(fraisStr) ?? 0;
    const impayes = toNum(impayesStr) ?? 0;
    const montantConso = toNum(montantConsoStr) ?? (nouveau - ancien) * prix;
    const montantAPayer = toNum(montantAPayerStr) ?? montantConso + frais + impayes;
    valid.push({ refAbonne, nom, numCompteur: numCompteur || "", localisation: localisation || "", numFacture: numFacture || "", ancien, nouveau, prix, frais, impayes, montantConso, montantAPayer });
  });
  return { valid, invalid };
}

function ImportDonnees({ periode, abonnes, onImportDonnees, onClose }) {
  const [importPeriode, setImportPeriode] = useState(periode);
  const [result, setResult] = useState(null);
  const [nomFichier, setNomFichier] = useState("");
  const [chargement, setChargement] = useState(false);
  const [erreurFichier, setErreurFichier] = useState("");
  const fileInputRef = React.useRef(null);

  const lireFichierExcel = (file) => {
    setChargement(true);
    setErreurFichier("");
    setResult(null);
    setNomFichier(file.name);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        const nonEmpty = rows.filter((r) => r.some((cell) => String(cell).trim() !== ""));
        const text = nonEmpty.map((r) => r.join("\t")).join("\n");
        const r = parseImportText(text);
        const doublonsPotentiels = r.valid.filter((row) => {
          const refNorm = (row.refAbonne || "").trim().toUpperCase();
          const nomNorm = normalizeName(row.nom);
          return abonnes.some((a) => normalizeName(a.nom) === nomNorm && (a.refAbonne || "").trim().toUpperCase() !== refNorm);
        });
        setResult({ ...r, doublonsPotentiels });
      } catch (err) {
        setErreurFichier("Impossible de lire ce fichier. Vérifie qu'il est au format .xlsx ou .csv.");
      }
      setChargement(false);
    };
    reader.onerror = () => {
      setErreurFichier("Erreur lors de la lecture du fichier.");
      setChargement(false);
    };
    reader.readAsArrayBuffer(file);
  };

  const confirmer = () => {
    if (!result || result.valid.length === 0) return;
    onImportDonnees(importPeriode, result.valid);
    setResult(null);
    setNomFichier("");
    onClose();
  };

  return (
    <Card className="mb-3 !border-2 !border-dashed !border-[#0F5C6B]/40">
      <p className="text-[13px] font-700 text-[#0F5C6B] mb-1">Importer des relevés/factures</p>
      <p className="text-[11px] text-[#5B7070] mb-3">
        Sélectionne ton fichier Excel (.xlsx) ou CSV. Les colonnes doivent être dans cet ordre :
      </p>
      <div className="bg-[#F0F6F5] rounded-lg p-2 mb-3 overflow-x-auto">
        <code className="text-[9.5px] text-[#14232B] whitespace-nowrap">
          Référence | Nom | N° compteur | Localisation | N° facture | Ancien index | Nouveau index | Prix unitaire | Frais entretien | Impayés antérieurs | Montant conso | Montant à payer
        </code>
      </div>

      <Field label="Mois concerné par cet import">
        <input type="month" className={inputCls} value={importPeriode} onChange={(e) => setImportPeriode(e.target.value)} />
      </Field>

      <input
        type="file"
        accept=".xlsx,.xls,.csv"
        ref={fileInputRef}
        style={{ display: "none" }}
        onChange={(e) => { if (e.target.files && e.target.files[0]) lireFichierExcel(e.target.files[0]); }}
      />

      <button
        onClick={() => { if (fileInputRef.current) fileInputRef.current.click(); }}
        className="w-full flex items-center justify-center gap-2 bg-[#0F5C6B] text-white rounded-xl py-3.5 font-700 text-[14px] mb-3 active:opacity-80"
      >
        📂  Choisir un fichier Excel (.xlsx / .csv)
      </button>

      {nomFichier && !chargement && (
        <p className="text-[11px] text-[#5B7070] mb-2">
          📄 Fichier sélectionné : <strong>{nomFichier}</strong>
        </p>
      )}

      {chargement && (
        <p className="text-[12px] text-[#0F5C6B] mb-2">⏳ Lecture du fichier en cours…</p>
      )}

      {erreurFichier && (
        <div className="bg-[#FCE4E1] text-[#C0392B] text-[11px] rounded-xl px-3 py-2 mb-3">
          ⚠️ {erreurFichier}
        </div>
      )}

      {result && (
        <div className="mb-3">
          <div className="bg-[#DCF3E6] text-[#2E8B57] text-[12px] font-700 rounded-xl px-3 py-2 mb-1.5">
            ✓ {result.valid.length} ligne(s) prête(s) à importer pour {periodeLabel(importPeriode)}
          </div>
          {result.invalid.length > 0 && (
            <div className="bg-[#FCE4E1] text-[#C0392B] text-[11px] rounded-xl px-3 py-2 mb-1.5">
              ⚠️ {result.invalid.length} ligne(s) ignorée(s) — vérifie l'ordre des colonnes :
              <ul className="mt-1 pl-4 list-disc">
                {result.invalid.slice(0, 5).map((e, i) => (
                  <li key={i}>Ligne {e.ligne} : {e.motif}</li>
                ))}
              </ul>
            </div>
          )}
          {result.doublonsPotentiels && result.doublonsPotentiels.length > 0 && (
            <div className="bg-[#FCF3E3] text-[#8A6316] text-[11px] rounded-xl px-3 py-2 mb-1.5">
              ⚠️ {result.doublonsPotentiels.length} nom(s) correspondent déjà à un abonné existant sous une référence différente — vérifie avant de confirmer :
              <ul className="mt-1 pl-4 list-disc">
                {result.doublonsPotentiels.slice(0, 5).map((r, i) => (
                  <li key={i}>{r.nom} (réf. : {r.refAbonne})</li>
                ))}
              </ul>
            </div>
          )}
          {result.valid.length > 0 && (
            <p className="text-[11px] text-[#5B7070] mb-2">
              Aperçu : {result.valid.slice(0, 3).map((r) => r.nom).join(", ")}{result.valid.length > 3 ? "…" : ""}
            </p>
          )}
        </div>
      )}

      <div className="flex gap-2">
        {result && result.valid.length > 0 && (
          <div className="flex-1">
            <BigButton icon={Save} color="#2E8B57" onClick={confirmer}>
              Confirmer l'import de {result.valid.length} ligne(s)
            </BigButton>
          </div>
        )}
        <button onClick={onClose} className="shrink-0 text-[12px] font-700 text-[#8FA3A3] px-3">Annuler</button>
      </div>
      <p className="text-[10px] text-[#8FA3A3] mt-2">
        Si un abonné existant partage la même « Référence », ses infos ne sont pas dupliquées ; seul le relevé du mois choisi est ajouté ou remplacé.
      </p>
    </Card>
  );
}

// Calcule automatiquement la prochaine référence abonné (001, 002, 003...)
function prochainRef(abonnes) {
  let max = 0;
  abonnes.forEach((a) => {
    const num = parseInt(String(a.refAbonne || "").replace(/[^0-9]/g, ""), 10);
    if (!isNaN(num) && num > max) max = num;
  });
  return String(max + 1).padStart(3, "0");
}

function Abonnes({ abonnes, zones, periode, canManage, canAdd, onAdd, onUpdate, onDelete, onImportDonnees, onFicheSuivi, onFicheInsolvables, onFicheSuspendre }) {
  const [showForm, setShowForm] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [q, setQ] = useState("");
  const [editingId, setEditingId] = useState(null);
  const empty = { refAbonne: "", nom: "", zone: zones[0] || "Zone 1", localisation: "", numCompteur: "", telephone: "", statut: "Actif" };
  const [form, setForm] = useState(empty);
  const emptyAbonnement = { active: false, montant: "", avance: "" };
  const [abonnement, setAbonnement] = useState(emptyAbonnement);

  const filtered = abonnes.filter(
    (a) => a.nom.toLowerCase().includes(q.toLowerCase()) || a.zone.toLowerCase().includes(q.toLowerCase()) || a.refAbonne.toLowerCase().includes(q.toLowerCase())
  );

  const startEdit = (a) => {
    setEditingId(a.id);
    setForm({ refAbonne: a.refAbonne, nom: a.nom, zone: a.zone, localisation: a.localisation || "", numCompteur: a.numCompteur || "", telephone: a.telephone || "", statut: a.statut || "Actif" });
    setShowForm(true);
  };

  const cancelForm = () => {
    setShowForm(false);
    setEditingId(null);
    setForm({ ...empty, refAbonne: "" });
    setAbonnement(emptyAbonnement);
  };

  const submit = (e) => {
    e.preventDefault();
    if (!form.nom || !form.refAbonne) return;
    if (editingId) {
      onUpdate({ id: editingId, ...form });
    } else {
      const montant = Number(abonnement.montant) || 0;
      onAdd(
        { id: uid(), ...form },
        abonnement.active && montant > 0 ? { montant, avance: Number(abonnement.avance) || 0 } : null
      );
    }
    cancelForm();
  };

  return (

      <SectionTitle light>Abonnés ({abonnes.length})</SectionTitle>

      <div className="flex gap-2 mb-3">
        <div className="relative flex-1">
          <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#8FA3A3]" />

        </div>

            {showForm ? <X size={20} /> : <Plus size={20} />}

      {canManage && onImportDonnees && (
        <button
          onClick={() => setShowImport((s) => !s)}

        >
          <Upload size={15} /> {showImport ? "Fermer l'import" : "Importer des données (factures d'un autre mois)"}
        </button>
      )}
      {canManage && showImport && onImportDonnees && (
        <ImportDonnees periode={periode} abonnes={abonnes} onImportDonnees={onImportDonnees} onClose={() => setShowImport(false)} />

      {onFicheSuivi && (
        <BigButton icon={Download} color="#E8A33D" onClick={onFicheSuivi}>
          Fiche de suivi des abonnés (PDF)
        </BigButton>
      )}
      <div className="h-2" />
      {onFicheInsolvables && (
        <BigButton icon={Download} color="#C0392B" onClick={onFicheInsolvables}>

      <div className="h-2" />
      {onFicheSuspendre && (
        <BigButton icon={Download} color="#14232B" onClick={onFicheSuspendre}>
          Fiche des clients à suspendre (PDF)
        </BigButton>
      )}
      <div className="h-3" />

      {canAdd && showForm && (
        <Card className="mb-4 !border-2 !border-[#0F5C6B]/30">
          {editingId && <p className="text-[12px] font-700 text-[#0F5C6B] mb-2">✏️ Modification de l'abonné</p>}
          <form onSubmit={submit}>
            <Field label="Réf. abonné *">
              <input className={inputCls} value={form.refAbonne} onChange={(e) => setForm({ ...form, refAbonne: e.target.value })} placeholder="Auto-généré (modifiable)" required />
            </Field>
            <Field label="Nom & prénom *">
              <input className={inputCls} value={form.nom} onChange={(e) => setForm({ ...form, nom: e.target.value })} required />
            </Field>
            <Field label="Zone">

                </label>

                  <>
                    <Field label="Montant total négocié (FCFA)">
                      <input type="number" className={inputCls} value={abonnement.montant} onChange={(e) => setAbonnement({ ...abonnement, montant: e.target.value })} placeholder="Ex: 100000" />

                        Reste à payer après avance : <strong>{fmt(Math.max(0, Number(abonnement.montant) - (Number(abonnement.avance) || 0)))}</strong> — ce solde sera automatiquement ajouté aux impayés de l'abonné.
                      </p>

                )}

            )}
            <div className="flex gap-2">
              <div className="flex-1">
                <BigButton type="submit" icon={Save}>{editingId ? "Enregistrer les modifications" : "Ajouter l'abonné"}</BigButton>
              </div>
              {editingId && (
                <button type="button" onClick={cancelForm} className="shrink-0 text-[12px] font-700 text-[#8FA3A3] px-3">Annuler</button>
              )}
            </div>
          </form>
        </Card>
      )}

      <div className="flex flex-col gap-2">
        {filtered.length === 0 && <p className="text-center text-white/80 text-sm py-8" style={{textShadow:"0 1px 4px rgba(0,0,0,0.3)"}}>Aucun abonné trouvé.</p>}
        {filtered.map((a, i) => (
          <Card key={a.id} className={`!p-3 ${i % 2 === 1 ? "!bg-[#F0F6F5]" : ""}`}>
            <div className="flex items-start justify-between gap-2">

function Releve({ periode, abonnes, zones, params, isDev, canAdd, canManage, paiements, relevesPeriode, resteAPayer, getAncienIndex, getImpayesAnterieurs, onSaveParams, onSaveReleve, onDeleteReleve, onGenerateZone, onError }) {
